<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PTW Taiwan Inventory System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleFileImport(event)">

  <!-- 頂部 Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-indigo-100 flex-shrink-0">
          <i data-lucide="boxes" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <h1 class="font-bold text-slate-900 text-base leading-tight truncate">PTW Taiwan Inventory System</h1>
            <span class="px-1.5 py-0.5 text-[10px] font-semibold bg-indigo-50 text-indigo-600 rounded border border-indigo-100 flex-shrink-0">PRO v3.8</span>
          </div>
          <p class="text-[11px] text-slate-400 truncate">Repair Warning Alert • Stock Linked • Column Customizer</p>
        </div>
      </div>

      <!-- 桌面端操作按鈕 -->
      <div class="hidden lg:flex items-center gap-2.5">
        <button onclick="fetchDataFromGAS()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-medium transition">
          <i data-lucide="refresh-cw" class="w-4 h-4 text-indigo-600"></i>
          <span>從 Sheet 刷新</span>
        </button>

        <button onclick="triggerFileInput()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg border border-emerald-300 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 text-xs font-semibold transition shadow-sm">
          <i data-lucide="upload" class="w-4 h-4 text-emerald-600"></i>
          <span>匯入 Excel 寫入 Sheet</span>
        </button>

        <button onclick="toggleSyncPanel()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-medium transition">
          <i data-lucide="cloud" class="w-4 h-4 text-sky-500"></i>
          <span>API 網址設定</span>
          <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-slate-300 ml-1"></span>
        </button>

        <button onclick="exportCSV()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-medium transition">
          <i data-lucide="download" class="w-4 h-4 text-slate-500"></i>
          <span>匯出 CSV</span>
        </button>

        <button onclick="openModal()" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-lg text-xs font-medium shadow-md shadow-indigo-100 transition">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>新增零件/異動</span>
        </button>
      </div>

      <!-- 手機端按鈕 -->
      <div class="lg:hidden flex items-center gap-2">
        <button onclick="fetchDataFromGAS()" class="p-2 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-medium border border-indigo-200 flex items-center gap-1">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
        <button onclick="openModal()" class="bg-indigo-600 text-white p-2 rounded-lg text-xs shadow-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
        <button onclick="toggleMobileMenu()" class="p-2 rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-50">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- 手機端展開選單 -->
    <div id="mobile-menu" class="hidden lg:hidden bg-slate-900 text-white p-4 border-b border-slate-800 space-y-3">
      <button onclick="fetchDataFromGAS(); toggleMobileMenu();" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-800 text-slate-200 text-xs font-medium">
        <i data-lucide="refresh-cw" class="w-4 h-4 text-indigo-400"></i> 從 Google Sheet 刷新數據
      </button>
      <button onclick="triggerFileInput(); toggleMobileMenu();" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-semibold">
        <i data-lucide="upload" class="w-4 h-4"></i> 匯入 Excel 寫入 Sheet
      </button>
      <button onclick="toggleSyncPanel(); toggleMobileMenu();" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-800 text-slate-200 text-xs font-medium">
        <i data-lucide="cloud" class="w-4 h-4 text-sky-400"></i> API 網址設定
      </button>
      <button onclick="exportCSV(); toggleMobileMenu();" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-800 text-slate-200 text-xs font-medium">
        <i data-lucide="download" class="w-4 h-4 text-slate-400"></i> 匯出 CSV 檔案
      </button>
    </div>
  </header>

  <!-- Google Sheet API 面板 -->
  <div id="sync-panel" class="hidden bg-slate-900 text-white border-b border-slate-800 p-4 transition-all">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <i data-lucide="key" class="w-5 h-5 text-indigo-400"></i>
        <div>
          <p class="text-sm font-semibold">Google Apps Script Web App URL 設定</p>
          <p class="text-xs text-slate-400">自動綁定 Google Sheet API 連線</p>
        </div>
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <input type="text" id="gas-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full md:w-96 px-3 py-1.5 rounded-lg text-xs bg-slate-800 border border-slate-700 text-slate-200 focus:outline-none focus:border-indigo-500 font-mono">
        <button onclick="saveGasUrl()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-medium rounded-lg whitespace-nowrap">儲存連線</button>
      </div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 pt-4 space-y-4">

    <!-- 🚨 送修超過 3 天未回帳警告區 (OVERDUE REPAIR ALERTS) -->
    <div id="alert-container" class="hidden bg-amber-50 border border-amber-300 rounded-2xl p-4 shadow-sm transition-all">
      <div class="flex items-center justify-between pb-2 border-b border-amber-200/60">
        <div class="flex items-center gap-2 text-amber-800 font-bold text-sm">
          <span class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-rose-500"></span>
          </span>
          <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-500"></i>
          <span>送修未回帳警告 (OUT=1 超過 3 天未歸還)</span>
          <span id="alert-count-badge" class="px-2 py-0.5 rounded-full text-xs font-extrabold bg-rose-500 text-white ml-1">0 項</span>
        </div>
        <button onclick="toggleAlertDetails()" class="text-xs text-amber-700 hover:text-amber-900 font-semibold flex items-center gap-1">
          <span id="toggle-alert-text">收合明細</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5" id="alert-chevron"></i>
        </button>
      </div>

      <!-- 警告明細清單 -->
      <div id="alert-list-wrapper" class="mt-3 space-y-2 max-h-48 overflow-y-auto pr-1">
        <!-- 動態警告卡片 -->
      </div>
    </div>

    <!-- 通知 Bar -->
    <div id="loading-bar" class="hidden bg-indigo-50 border border-indigo-200 rounded-xl p-3 flex items-center justify-between text-indigo-700 text-xs font-semibold">
      <span class="flex items-center gap-2" id="loading-text">
        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 正在向 Google Sheet 自動抓取最新數據...
      </span>
    </div>

    <!-- 統計卡片 -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <div class="glass-card p-4 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">總品項數</p>
          <h3 id="stat-total-items" class="text-xl font-extrabold text-slate-800 mt-0.5">0</h3>
        </div>
        <div class="w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600">
          <i data-lucide="layers" class="w-4 h-4"></i>
        </div>
      </div>

      <div class="glass-card p-4 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">在地總庫存</p>
          <h3 id="stat-total-qty" class="text-xl font-extrabold text-emerald-600 mt-0.5">0</h3>
        </div>
        <div class="w-9 h-9 rounded-lg bg-emerald-50 flex items-center justify-center text-emerald-600">
          <i data-lucide="package-check" class="w-4 h-4"></i>
        </div>
      </div>

      <div class="glass-card p-4 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">缺貨品項</p>
          <h3 id="stat-zero-qty" class="text-xl font-extrabold text-slate-700 mt-0.5">0</h3>
        </div>
        <div class="w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500">
          <i data-lucide="package-x" class="w-4 h-4"></i>
        </div>
      </div>

      <div class="glass-card p-4 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">目前分頁</p>
          <h3 id="stat-sheet-name" class="text-sm font-bold text-sky-600 mt-1 truncate">Stock in TW</h3>
        </div>
        <div class="w-9 h-9 rounded-lg bg-sky-50 flex items-center justify-center text-sky-600">
          <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
        </div>
      </div>
    </div>

    <!-- 依序固定分頁按鈕：Stock in TW, S2, S3, S4, S5, S6, DRY BOX, Clean room -->
    <div class="space-y-3 pt-1">
      <div class="flex items-center justify-between gap-2 border-b border-slate-200 pb-2 overflow-x-auto no-scrollbar">
        <div class="flex items-center gap-1.5 flex-nowrap" id="sheet-tabs-container">
        </div>
        <span id="filtered-count" class="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg whitespace-nowrap flex-shrink-0">
          0 筆
        </span>
      </div>

      <!-- 搜尋列 + Location 篩選 + QTY 篩選 + 調整欄位選單 -->
      <div class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center gap-2.5">
        <div class="relative w-full md:flex-1">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="搜尋關鍵字 (料號, 品名, 規格, 備註...)" class="w-full pl-9 pr-3 py-1.5 text-xs rounded-lg bg-slate-50 border border-slate-200 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto flex-wrap">
          <!-- Location 篩選 -->
          <select id="filter-location" onchange="handleSearch()" class="flex-1 md:w-32 px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-700">
            <option value="ALL">全部 Location</option>
            <option value="S2">S2</option>
            <option value="S3">S3</option>
            <option value="S4">S4</option>
            <option value="S5">S5</option>
            <option value="S6">S6</option>
            <option value="DRY BOX">DRY BOX</option>
            <option value="Clean room">Clean room</option>
          </select>

          <!-- QTY 篩選 -->
          <select id="filter-qty" onchange="handleSearch()" class="flex-1 md:w-32 px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-700">
            <option value="ALL">全部 QTY</option>
            <option value="IN_STOCK">有庫存 (>0)</option>
            <option value="ZERO">零庫存/缺貨 (=0)</option>
          </select>

          <!-- 欄位調整下拉 -->
          <div class="relative">
            <button onclick="toggleColumnMenu()" class="px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 flex items-center gap-1 font-medium">
              <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5 text-slate-500"></i>
              <span>調整欄位</span>
            </button>
            <div id="column-dropdown" class="hidden absolute right-0 mt-1 w-48 bg-white border border-slate-200 rounded-xl shadow-xl z-40 p-2 text-xs space-y-1">
              <p class="font-bold text-slate-400 text-[10px] uppercase px-1 pb-1 border-b border-slate-100">勾選顯示欄位</p>
              <div id="column-checkboxes" class="max-h-48 overflow-y-auto space-y-1 pt-1">
              </div>
            </div>
          </div>

          <!-- 每頁筆數 -->
          <select id="page-size" onchange="changePageSize()" class="px-2 py-1.5 text-xs rounded-lg border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-600">
            <option value="25">25 筆/頁</option>
            <option value="50" selected>50 筆/頁</option>
            <option value="100">100 筆/頁</option>
            <option value="9999">全部顯示</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 表格容器：高度限制 + 表頭置頂 (Sticky Table Header) -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
      <div class="overflow-x-auto max-h-[62vh] overflow-y-auto relative">
        <table class="w-full text-left border-collapse min-w-[700px]">
          <thead class="sticky top-0 z-20 bg-slate-100 shadow-sm">
            <tr id="dynamic-thead" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">
            </tr>
          </thead>
          <tbody id="dynamic-tbody" class="divide-y divide-slate-100 text-xs">
          </tbody>
        </table>
      </div>

      <!-- 分頁導覽區 (Pagination) -->
      <div class="p-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 bg-slate-50/50">
        <span id="page-info">第 1 頁，共 1 頁</span>
        <div class="flex items-center gap-1.5">
          <button onclick="prevPage()" id="btn-prev" class="px-3 py-1 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-40 font-medium">上一頁</button>
          <button onclick="nextPage()" id="btn-next" class="px-3 py-1 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-40 font-medium">下一頁</button>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal -->
  <div id="item-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-lg overflow-hidden transition-all">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4 text-indigo-600"></i>
          <span id="modal-title">新增/編輯零件記錄</span>
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="item-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="form-edit-index" value="-1">

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">貨架號 (Location)</label>
            <select id="form-rack" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="S2">S2</option>
              <option value="S3">S3</option>
              <option value="S4">S4</option>
              <option value="S5">S5</option>
              <option value="S6" selected>S6</option>
              <option value="DRY BOX">DRY BOX</option>
              <option value="Clean room">Clean room</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">料號 (P/N)</label>
            <input type="text" id="form-pn" placeholder="例如: 3A9-704C51-0231W2006" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 (Parts Name)</label>
          <input type="text" id="form-parts-name" required placeholder="例如: Power supply" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">數量 (QTY)</label>
            <input type="number" id="form-qty" value="1" min="0" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center font-bold">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">進貨 (IN)</label>
            <input type="number" id="form-in" value="0" min="0" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">出貨 (OUT)</label>
            <input type="number" id="form-out" value="0" min="0" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">適用機型 (Model)</label>
            <input type="text" id="form-model" placeholder="例如: 88xx/92xx" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">盤點人員 (Auditor)</label>
            <input type="text" id="form-auditor" value="Vincent" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">備註 (Remarks)</label>
          <input type="text" id="form-remarks" placeholder="例如: From Vincent" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="pt-2 flex items-center justify-end gap-3 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">取消</button>
          <button type="submit" class="px-5 py-2 text-xs font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md shadow-indigo-100 transition">儲存並同步至 Google Sheet</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbxm8arB97z2ZS_iwuC5M9RDWAjDYvVckHkHSb3DHlzyxU1ya0stvNcpEvyWWz55QQK-UA/exec";

    const orderedSheetNames = ['Stock in TW', 'S2', 'S3', 'S4', 'S5', 'S6', 'DRY BOX', 'Clean room'];

    let allSheetData = {};
    let dynamicHeaders = ['LOCATION', 'P/N (IF ANY)', 'PARTS NAME', 'MODEL', 'QTY', 'IN', 'OUT', 'DATE', 'REMARK'];
    let visibleColumns = new Set();
    let currentSheetName = 'Stock in TW';
    let currentRows = [];
    let filteredRows = [];

    // 分頁設定
    let currentPage = 1;
    let pageSize = 50;

    const locationBadges = {
      'S2': 'bg-amber-50 text-amber-700 border-amber-200',
      'S3': 'bg-sky-50 text-sky-700 border-sky-200',
      'S4': 'bg-cyan-50 text-cyan-700 border-cyan-200',
      'S5': 'bg-indigo-50 text-indigo-700 border-indigo-200',
      'S6': 'bg-rose-50 text-rose-700 border-rose-200',
      'DRY BOX': 'bg-purple-50 text-purple-700 border-purple-200',
      'Clean room': 'bg-emerald-50 text-emerald-700 border-emerald-200'
    };

    function saveToStorage() { localStorage.setItem('PARTS_DB_CACHE', JSON.stringify(allSheetData)); }
    function loadFromStorage() {
      const cached = localStorage.getItem('PARTS_DB_CACHE');
      if (cached) { try { allSheetData = JSON.parse(cached); return true; } catch (e) {} }
      return false;
    }

    function getGasUrl() {
      return localStorage.getItem('GAS_WEB_APP_URL') || DEFAULT_GAS_URL;
    }

    // 清理重複的 Location 欄位與內部 _id
    function cleanRowHeaders(row, fallbackLocation) {
      let cleaned = {};
      let seenLocation = false;

      Object.keys(row).forEach(k => {
        const kTrim = String(k).trim();
        const kLower = kTrim.toLowerCase();

        if (kLower === '_id' || kLower === 'id' || kLower === '_rowindex') return;

        if (kLower.includes('location') || kLower.includes('貨架')) {
          if (!seenLocation) {
            cleaned['LOCATION'] = row[k] || fallbackLocation;
            seenLocation = true;
          }
        } else {
          cleaned[kTrim] = row[k];
        }
      });

      if (!seenLocation) {
        cleaned['LOCATION'] = fallbackLocation;
      }
      return cleaned;
    }

    // 連動計算：讓 Stock in TW 100% 來自 S2~S6, DRY BOX, Clean room 明細
    function reaggregateMasterSheet() {
      let aggregated = [];
      const subSheets = ['S2', 'S3', 'S4', 'S5', 'S6', 'DRY BOX', 'Clean room'];

      subSheets.forEach(sheetName => {
        const rows = allSheetData[sheetName] || [];
        rows.forEach(r => {
          let item = cleanRowHeaders(r, sheetName);
          item['QTY'] = Number(item['QTY'] !== undefined ? item['QTY'] : 0);
          aggregated.push(item);
        });
      });

      allSheetData['Stock in TW'] = aggregated;
      checkRepairAlerts(); // 每次資料重算時同步檢驗送修警告
    }

    // 🚨 核心警示機制：比對最新一筆紀錄，若 OUT=1 超過 3 天未歸還則警示
    function checkRepairAlerts() {
      const allRows = allSheetData['Stock in TW'] || [];
      const partsGroup = {};

      allRows.forEach(row => {
        const pn = String(row['P/N (IF ANY)'] || row['P/N (If any)'] || '').trim();
        const name = String(row['PARTS NAME'] || row['Parts Name'] || '').trim();
        if (!name) return;

        const groupKey = `${pn}___${name}`;
        if (!partsGroup[groupKey]) partsGroup[groupKey] = [];
        partsGroup[groupKey].push(row);
      });

      const overdueItems = [];
      const today = new Date();

      Object.keys(partsGroup).forEach(key => {
        const items = partsGroup[key];
        
        // 依日期排序，找出最後一筆 (最新)
        items.sort((a, b) => {
          const dateA = parseDate(a['DATE'] || a['Date'] || a['Last Audit'] || '');
          const dateB = parseDate(b['DATE'] || b['Date'] || b['Last Audit'] || '');
          return dateB - dateA;
        });

        const latestRecord = items[0];
        const outQty = Number(latestRecord['OUT'] || latestRecord['out'] || 0);
        const inQty = Number(latestRecord['IN'] || latestRecord['in'] || 0);

        // 如果最後一筆狀態為 OUT=1 (且尚未回帳 IN=1)
        if (outQty === 1 && inQty === 0) {
          const outDate = parseDate(latestRecord['DATE'] || latestRecord['Date'] || latestRecord['Last Audit'] || '');
          if (outDate && !isNaN(outDate.getTime())) {
            const diffTime = today.getTime() - outDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays >= 3) {
              const [pn, name] = key.split('___');
              overdueItems.push({
                location: latestRecord['LOCATION'] || 'TW',
                pn: pn || '-',
                partsName: name,
                outDate: formatDate(outDate),
                overdueDays: diffDays,
                remark: latestRecord['REMARK'] || latestRecord['Remarks'] || '等待送修返回'
              });
            }
          }
        }
      });

      renderAlertBox(overdueItems);
    }

    // 渲染警示橫幅卡片
    function renderAlertBox(overdueItems) {
      const container = document.getElementById('alert-container');
      const countBadge = document.getElementById('alert-count-badge');
      const listWrapper = document.getElementById('alert-list-wrapper');

      if (overdueItems.length === 0) {
        container.classList.add('hidden');
        return;
      }

      container.classList.remove('hidden');
      countBadge.innerText = `${overdueItems.length} 項零件`;

      listWrapper.innerHTML = overdueItems.map(item => `
        <div class="bg-white p-3 rounded-xl border border-amber-200/80 shadow-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="px-2 py-0.5 rounded font-bold bg-rose-50 text-rose-700 border border-rose-200">${item.location}</span>
            <span class="font-mono font-semibold text-slate-700">${item.pn}</span>
            <span class="font-bold text-slate-900">${item.partsName}</span>
            <span class="text-slate-400">|</span>
            <span class="text-slate-500">出庫送修：${item.outDate}</span>
            <span class="text-slate-400">(${item.remark})</span>
          </div>
          <div class="flex items-center gap-1.5 flex-shrink-0">
            <span class="px-2.5 py-1 rounded-md text-[11px] font-extrabold bg-rose-100 text-rose-800 border border-rose-300 animate-pulse">
              已送修 ${item.overdueDays} 天未回帳
            </span>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function toggleAlertDetails() {
      const list = document.getElementById('alert-list-wrapper');
      const text = document.getElementById('toggle-alert-text');
      const icon = document.getElementById('alert-chevron');

      if (list.classList.contains('hidden')) {
        list.classList.remove('hidden');
        text.innerText = '收合明細';
        icon.classList.remove('rotate-180');
      } else {
        list.classList.add('hidden');
        text.innerText = '展開明細';
        icon.classList.add('rotate-180');
      }
    }

    function parseDate(dateStr) {
      if (!dateStr) return null;
      if (dateStr instanceof Date) return dateStr;
      
      // 處理 4月9日 / 4/9 格式
      const cnMatch = String(dateStr).match(/(\d+)月(\d+)日/);
      if (cnMatch) {
        return new Date(2026, parseInt(cnMatch[1]) - 1, parseInt(cnMatch[2]));
      }

      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? null : d;
    }

    async function fetchDataFromGAS() {
      const gasUrl = getGasUrl();
      if (!gasUrl) return;

      const loadingBar = document.getElementById('loading-bar');
      const loadingText = document.getElementById('loading-text');
      loadingText.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 正在向 Google Sheet 自動抓取最新數據...`;
      loadingBar.classList.remove('hidden');
      lucide.createIcons();

      try {
        const res = await fetch(gasUrl);
        const json = await res.json();

        if (json.status === 'success' && json.data) {
          allSheetData = json.data;

          Object.keys(allSheetData).forEach(s => {
            if (Array.isArray(allSheetData[s])) {
              allSheetData[s] = allSheetData[s].map(r => cleanRowHeaders(r, s));
            }
          });

          reaggregateMasterSheet();
          saveToStorage();

          renderSheetTabs();
          switchSheet('Stock in TW');
        }
      } catch (err) {
        console.error('Fetch Google Sheet Error:', err);
      } finally {
        loadingBar.classList.add('hidden');
      }
    }

    async function handleFileImport(e) {
      const file = e.target.files[0];
      if (!file) return;

      const gasUrl = getGasUrl();
      const reader = new FileReader();

      reader.onload = async function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          let importedData = {};

          workbook.SheetNames.forEach(sheetName => {
            if (sheetName.toLowerCase().startsWith('print') || sheetName.toUpperCase() === 'S1') return;

            const worksheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            if (!json || json.length < 2) return;

            let headerIdx = -1;
            for (let i = 0; i < Math.min(json.length, 15); i++) {
              if (json[i] && json[i].filter(c => c !== undefined && c !== '').length >= 2) {
                headerIdx = i;
                break;
              }
            }

            if (headerIdx === -1) return;

            const rawHeaders = json[headerIdx].map((h, idx) => h ? String(h).trim() : `COL_${idx + 1}`);
            const rowsData = json.slice(headerIdx + 1);
            let sheetRows = [];

            rowsData.forEach(row => {
              if (!row || row.length === 0) return;
              let rowObj = {};
              let isNonEmpty = false;

              rawHeaders.forEach((header, cIdx) => {
                let cellVal = row[cIdx];
                if (cellVal !== undefined && cellVal !== null && String(cellVal).trim() !== '') {
                  isNonEmpty = true;
                  cellVal = formatExcelDate(cellVal);
                } else {
                  cellVal = '';
                }
                if (header !== '_id' && header !== 'id') {
                  rowObj[header] = cellVal;
                }
              });

              if (isNonEmpty) {
                sheetRows.push(cleanRowHeaders(rowObj, sheetName));
              }
            });

            if (sheetRows.length > 0) {
              importedData[sheetName] = sheetRows;
            }
          });

          const loadingBar = document.getElementById('loading-bar');
          const loadingText = document.getElementById('loading-text');
          loadingText.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 正在將資料寫入至 Google Sheet，請稍候...`;
          loadingBar.classList.remove('hidden');
          lucide.createIcons();

          if (gasUrl) {
            await fetch(gasUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'BULK_IMPORT', allData: importedData })
            });
          }

          allSheetData = importedData;
          reaggregateMasterSheet();
          saveToStorage();

          renderSheetTabs();
          switchSheet('Stock in TW');

          loadingBar.classList.add('hidden');
          alert('🎉 成功！資料已上傳至 Google Sheet 並完成 QTY 連動與警示更新！');

        } catch (err) {
          alert('匯入失敗：' + err.message);
          document.getElementById('loading-bar').classList.add('hidden');
        }
        e.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

    function triggerFileInput() { document.getElementById('excel-file-input').click(); }

    function formatExcelDate(val) {
      if (typeof val === 'number' && val > 40000 && val < 60000) {
        const date = new Date((val - 25569) * 86400 * 1000);
        return formatDate(date);
      }
      return String(val);
    }

    function formatDate(d) {
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
    }

    function renderSheetTabs() {
      const container = document.getElementById('sheet-tabs-container');
      container.innerHTML = orderedSheetNames.map(name => `
        <button onclick="switchSheet('${name}')" id="sheet-btn-${name}" class="sheet-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-200/60 transition flex items-center gap-1 flex-shrink-0">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> ${name}
        </button>
      `).join('');
      lucide.createIcons();
    }

    function switchSheet(sheetName) {
      currentSheetName = sheetName;
      if (sheetName === 'Stock in TW') {
        reaggregateMasterSheet();
      }
      currentRows = [...(allSheetData[sheetName] || [])];

      if (currentRows.length > 0) {
        let headers = Object.keys(currentRows[0]).filter(h => h !== '_id' && h !== 'id' && h !== '_rowIndex');
        headers = headers.filter(h => h !== 'LOCATION' && !h.toLowerCase().includes('location') && !h.toLowerCase().includes('貨架'));
        headers.unshift('LOCATION');
        dynamicHeaders = headers;
      }

      if (visibleColumns.size === 0) {
        dynamicHeaders.forEach(h => visibleColumns.add(h));
      } else {
        dynamicHeaders.forEach(h => {
          if (!visibleColumns.has(h) && visibleColumns.size < 8) visibleColumns.add(h);
        });
      }

      renderColumnCheckboxes();

      document.querySelectorAll('.sheet-tab-btn').forEach(btn => {
        btn.className = 'sheet-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-200/60 transition flex items-center gap-1 flex-shrink-0';
      });

      const activeBtn = document.getElementById(`sheet-btn-${sheetName}`);
      if (activeBtn) {
        activeBtn.className = 'sheet-tab-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow-sm flex items-center gap-1.5 flex-shrink-0';
      }

      currentPage = 1;
      handleSearch();
    }

    function toggleColumnMenu() {
      document.getElementById('column-dropdown').classList.toggle('hidden');
    }

    function renderColumnCheckboxes() {
      const box = document.getElementById('column-checkboxes');
      box.innerHTML = dynamicHeaders.map(col => `
        <label class="flex items-center gap-2 p-1 hover:bg-slate-50 rounded cursor-pointer">
          <input type="checkbox" onchange="toggleColumnVisibility('${col}')" ${visibleColumns.has(col) ? 'checked' : ''} class="rounded text-indigo-600 focus:ring-indigo-500">
          <span class="truncate">${col}</span>
        </label>
      `).join('');
    }

    function toggleColumnVisibility(col) {
      if (visibleColumns.has(col)) {
        if (visibleColumns.size > 1) visibleColumns.delete(col);
      } else {
        visibleColumns.add(col);
      }
      renderCurrentPageTable();
    }

    function handleSearch() {
      const keyword = document.getElementById('search-input').value.toLowerCase();
      const locFilter = document.getElementById('filter-location').value;
      const qtyFilter = document.getElementById('filter-qty').value;

      filteredRows = currentRows.filter(row => {
        if (locFilter !== 'ALL') {
          const rowLoc = row['LOCATION'] || row['貨架'] || currentSheetName;
          if (rowLoc !== locFilter) return false;
        }

        const qtyCol = dynamicHeaders.find(h => h.toLowerCase().includes('qty') || h.toLowerCase().includes('數量')) || 'QTY';
        const num = Number(row[qtyCol]) || 0;
        if (qtyFilter === 'IN_STOCK' && num <= 0) return false;
        if (qtyFilter === 'ZERO' && num > 0) return false;

        if (keyword) {
          const match = dynamicHeaders.some(key => {
            return String(row[key] || '').toLowerCase().includes(keyword);
          });
          if (!match) return false;
        }

        return true;
      });

      currentPage = 1;
      renderCurrentPageTable();
    }

    function renderCurrentPageTable() {
      const thead = document.getElementById('dynamic-thead');
      const tbody = document.getElementById('dynamic-tbody');

      const activeColumns = dynamicHeaders.filter(col => visibleColumns.has(col));

      let headerHTML = `<th class="py-3 px-4 w-12 text-center bg-slate-100">#</th>`;
      activeColumns.forEach(col => {
        headerHTML += `<th class="py-3 px-4 bg-slate-100">${col}</th>`;
      });
      headerHTML += `<th class="py-3 px-4 text-center w-24 bg-slate-100">操作</th>`;
      thead.innerHTML = headerHTML;

      if (filteredRows.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="${activeColumns.length + 2}" class="text-center py-12 text-slate-400">
              <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 text-slate-300"></i>
              無符合條件的數據
            </td>
          </tr>
        `;
        lucide.createIcons();
        updateMetrics(0);
        updatePaginationInfo(0);
        return;
      }

      const startIdx = (currentPage - 1) * pageSize;
      const endIdx = startIdx + pageSize;
      const pageData = filteredRows.slice(startIdx, endIdx);

      tbody.innerHTML = pageData.map((row, index) => {
        const actualIndex = startIdx + index + 1;
        let colsHTML = `<td class="py-2.5 px-4 text-center font-mono text-slate-400">${actualIndex}</td>`;

        activeColumns.forEach(colKey => {
          let val = row[colKey] !== undefined && row[colKey] !== null ? row[colKey] : '';
          const keyLower = colKey.toLowerCase();

          if (colKey === 'LOCATION' || keyLower.includes('貨架')) {
            const badgeStyle = locationBadges[val] || 'bg-slate-100 text-slate-700 border-slate-200';
            colsHTML += `<td class="py-2.5 px-4"><span class="px-2 py-0.5 rounded text-xs font-bold border ${badgeStyle}">${val}</span></td>`;
          }
          else if (keyLower === 'qty' || keyLower.includes('數量')) {
            const num = Number(val) || 0;
            const qtyBadge = num > 0 
              ? `<span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-emerald-50 text-emerald-600 border border-emerald-200">${num}</span>`
              : `<span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-slate-100 text-slate-400 border border-slate-200">${num}</span>`;
            colsHTML += `<td class="py-2.5 px-4 text-center">${qtyBadge}</td>`;
          }
          else {
            colsHTML += `<td class="py-2.5 px-4 text-slate-700 max-w-xs truncate">${val}</td>`;
          }
        });

        colsHTML += `
          <td class="py-2.5 px-4 text-center">
            <div class="flex items-center justify-center gap-1">
              <button onclick="editRow(${startIdx + index})" class="p-1 text-slate-400 hover:text-indigo-600 rounded">
                <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="deleteRow(${startIdx + index})" class="p-1 text-slate-400 hover:text-rose-600 rounded">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </td>
        `;

        return `<tr class="hover:bg-slate-50/80 transition">${colsHTML}</tr>`;
      }).join('');

      lucide.createIcons();
      updateMetrics(filteredRows.length);
      updatePaginationInfo(filteredRows.length);
    }

    function updatePaginationInfo(totalCount) {
      const maxPage = Math.max(1, Math.ceil(totalCount / pageSize));
      document.getElementById('page-info').innerText = `第 ${currentPage} 頁 / 共 ${maxPage} 頁 (共 ${totalCount} 筆)`;
      document.getElementById('btn-prev').disabled = currentPage <= 1;
      document.getElementById('btn-next').disabled = currentPage >= maxPage;
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderCurrentPageTable();
      }
    }

    function nextPage() {
      const maxPage = Math.ceil(filteredRows.length / pageSize);
      if (currentPage < maxPage) {
        currentPage++;
        renderCurrentPageTable();
      }
    }

    function changePageSize() {
      pageSize = parseInt(document.getElementById('page-size').value) || 50;
      currentPage = 1;
      renderCurrentPageTable();
    }

    function updateMetrics(renderedCount) {
      document.getElementById('stat-total-items').innerText = currentRows.length;
      document.getElementById('stat-sheet-name').innerText = currentSheetName;

      const qtyCol = dynamicHeaders.find(h => h.toLowerCase().includes('qty') || h.toLowerCase().includes('數量')) || 'QTY';
      let totalQty = 0;
      let zeroCount = 0;
      if (qtyCol) {
        totalQty = currentRows.reduce((sum, r) => sum + (Number(r[qtyCol]) || 0), 0);
        zeroCount = currentRows.filter(r => (Number(r[qtyCol]) || 0) === 0).length;
      }
      document.getElementById('stat-total-qty').innerText = totalQty;
      document.getElementById('stat-zero-qty').innerText = zeroCount;
      document.getElementById('filtered-count').innerText = `顯示: ${renderedCount} 筆`;
    }

    function openModal() {
      document.getElementById('form-edit-index').value = "-1";
      document.getElementById('modal-title').innerText = "新增零件記錄";
      document.getElementById('item-modal').classList.remove('hidden');
    }
    function closeModal() { document.getElementById('item-modal').classList.add('hidden'); }

    function editRow(index) {
      const row = filteredRows[index];
      if (!row) return;

      document.getElementById('form-edit-index').value = index;
      document.getElementById('modal-title').innerText = "編輯零件記錄";
      document.getElementById('form-rack').value = row['LOCATION'] || row['貨架'] || 'S6';
      document.getElementById('form-pn').value = row['P/N (IF ANY)'] || row['P/N (If any)'] || '';
      document.getElementById('form-parts-name').value = row['PARTS NAME'] || row['Parts Name'] || '';
      document.getElementById('form-qty').value = row['QTY'] !== undefined ? row['QTY'] : 1;
      document.getElementById('form-in').value = row['IN'] !== undefined ? row['IN'] : 0;
      document.getElementById('form-out').value = row['OUT'] !== undefined ? row['OUT'] : 0;
      document.getElementById('form-model').value = row['MODEL'] || row['Model'] || '';
      document.getElementById('form-auditor').value = row['Auditor'] || 'Vincent';
      document.getElementById('form-remarks').value = row['REMARK'] || row['Remarks'] || '';

      document.getElementById('item-modal').classList.remove('hidden');
    }

    function deleteRow(index) {
      if (confirm('確定要刪除這筆記錄嗎？')) {
        const itemToDelete = filteredRows[index];
        currentRows = currentRows.filter(r => r !== itemToDelete);

        if (currentSheetName !== 'Stock in TW') {
          allSheetData[currentSheetName] = [...currentRows];
        }
        reaggregateMasterSheet();
        saveToStorage();
        handleSearch();
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const editIdx = parseInt(document.getElementById('form-edit-index').value);

      const rowObj = {
        'LOCATION': document.getElementById('form-rack').value,
        'P/N (IF ANY)': document.getElementById('form-pn').value,
        'PARTS NAME': document.getElementById('form-parts-name').value,
        'QTY': Number(document.getElementById('form-qty').value) || 0,
        'IN': Number(document.getElementById('form-in').value) || 0,
        'OUT': Number(document.getElementById('form-out').value) || 0,
        'DATE': formatDate(new Date()),
        'MODEL': document.getElementById('form-model').value,
        'REMARK': document.getElementById('form-remarks').value,
        'Auditor': document.getElementById('form-auditor').value,
        'Last Audit': formatDate(new Date())
      };

      if (editIdx >= 0) {
        currentRows[editIdx] = rowObj;
      } else {
        currentRows.unshift(rowObj);
      }

      const targetRack = rowObj['LOCATION'];
      if (!allSheetData[targetRack]) allSheetData[targetRack] = [];
      if (editIdx < 0) allSheetData[targetRack].unshift(rowObj);

      reaggregateMasterSheet();
      saveToStorage();
      handleSearch();
      closeModal();
      syncToGAS(rowObj);
    }

    function toggleSyncPanel() { document.getElementById('sync-panel').classList.toggle('hidden'); }
    function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }

    function saveGasUrl() {
      const url = document.getElementById('gas-url-input').value.trim();
      localStorage.setItem('GAS_WEB_APP_URL', url);
      alert('Google Apps Script URL 已成功儲存！');
      checkSyncStatus();
      fetchDataFromGAS();
    }

    function checkSyncStatus() {
      const gasUrl = getGasUrl();
      const dot = document.getElementById('sync-status-dot');
      if (gasUrl) {
        document.getElementById('gas-url-input').value = gasUrl;
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 ml-1 animate-pulse';
      }
    }

    async function syncToGAS(itemData) {
      const gasUrl = getGasUrl();
      if (!gasUrl) return;

      try {
        await fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...itemData, targetSheet: itemData['LOCATION'] || currentSheetName })
        });
      } catch (err) {
        console.error('GAS Sync Error:', err);
      }
    }

    function exportCSV() {
      if (filteredRows.length === 0) { alert('無數據可匯出！'); return; }
      const activeColumns = dynamicHeaders.filter(h => visibleColumns.has(h));
      let csv = '\uFEFF' + activeColumns.join(',') + '\n';
      filteredRows.forEach(row => {
        let line = activeColumns.map(k => `"${String(row[k] || '').replace(/"/g, '""')}"`).join(',');
        csv += line + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${currentSheetName}_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.addEventListener('click', function(e) {
      const dropdown = document.getElementById('column-dropdown');
      if (!dropdown.contains(e.target) && !e.target.closest('button[onclick="toggleColumnMenu()"]')) {
        dropdown.classList.add('hidden');
      }
    });

    window.onload = () => {
      lucide.createIcons();
      checkSyncStatus();

      const hasCache = loadFromStorage();
      if (hasCache) {
        reaggregateMasterSheet();
        renderSheetTabs();
        switchSheet('Stock in TW');
      }

      fetchDataFromGAS();
    };
  </script>
</body>
</html>
