<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>零件庫房進出管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <div class="max-w-7xl mx-auto p-4 md:p-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 mb-4 border-b border-gray-200 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">零件庫存與進出管理系統</h1>
        <p class="text-xs text-gray-500 mt-1">Google Sheets 即時連動平台</p>
      </div>
      <button onclick="fetchCurrentTab()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded shadow">重新載入資料</button>
    </div>

    <!-- 8 分頁標籤 -->
    <div class="flex overflow-x-auto border-b border-gray-200 mb-6 gap-1" id="tabContainer">
      <button class="tab-btn px-4 py-2 font-medium border-b-2 border-blue-600 text-blue-600" onclick="switchTab('Stock in TW')">Stock in TW (總庫存)</button>
      <button class="tab-btn px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-blue-600" onclick="switchTab('S2')">S2</button>
      <button class="tab-btn px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-blue-600" onclick="switchTab('S3')">S3</button>
      <button class="tab-btn px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-blue-600" onclick="switchTab('S4')">S4</button>
      <button class="tab-btn px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-blue-600" onclick="switchTab('S5')">S5</button>
      <button class="tab-btn px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-blue-600" onclick="switchTab('S6')">S6</button>
      <button class="tab-btn px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-blue-600" onclick="switchTab('DRY BOX')">DRY BOX</button>
      <button class="tab-btn px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-blue-600" onclick="switchTab('clean room')">clean room</button>
    </div>

    <!-- 錄入與匯入操作面板 (總庫存頁面隱藏) -->
    <div id="actionBox" class="hidden bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-6">
      <h2 class="text-sm font-bold text-gray-700 mb-3" id="panelTitle">新增進出紀錄</h2>
      <form id="recordForm" onsubmit="submitSingleRecord(event)" class="grid grid-cols-1 md:grid-cols-7 gap-2">
        <input type="date" id="rDate" class="border p-2 text-sm rounded" required>
        <input type="text" id="rPn" placeholder="P/N (If any)" class="border p-2 text-sm rounded">
        <input type="text" id="rName" placeholder="Parts Name" class="border p-2 text-sm rounded" required>
        <input type="text" id="rModel" placeholder="Model" class="border p-2 text-sm rounded">
        <input type="number" id="rIn" placeholder="IN 數量" min="0" value="0" class="border p-2 text-sm rounded">
        <input type="number" id="rOut" placeholder="OUT 數量" min="0" value="0" class="border p-2 text-sm rounded">
        <input type="text" id="rRemark" placeholder="Remark" class="border p-2 text-sm rounded">
        <button type="submit" class="md:col-span-7 bg-emerald-600 hover:bg-emerald-700 text-white py-2 text-sm font-semibold rounded mt-2">儲存至該庫房</button>
      </form>

      <div class="mt-4 pt-3 border-t border-gray-100 flex flex-wrap items-center gap-3">
        <span class="text-xs font-semibold text-gray-600">批次 CSV 檔案匯入至目前分頁：</span>
        <input type="file" id="csvFile" accept=".csv" onchange="uploadCSV(event)" class="text-xs">
      </div>
    </div>

    <!-- 搜尋工具 -->
    <div class="mb-4">
      <input type="text" id="filterInput" oninput="applyFilter()" placeholder="快速搜尋零件料號、名稱、型號..." class="w-full md:w-96 border p-2 text-sm rounded bg-white shadow-sm">
    </div>

    <!-- 資料呈現清單 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
      <table class="w-full text-left text-sm" id="mainTable">
        <thead class="bg-gray-100 text-gray-600 uppercase text-xs" id="tableHead"></thead>
        <tbody id="tableBody" class="divide-y divide-gray-100"></tbody>
      </table>
    </div>
  </div>

  <script>
    // 部署 GAS 後取得的網頁應用程式 URL
    const GAS_ENDPOINT = "YOUR_APPS_SCRIPT_WEB_APP_URL";
    let activeTab = "Stock in TW";
    let cachedData = [];

    window.onload = () => {
      document.getElementById("rDate").value = new Date().toISOString().split("T")[0];
      fetchCurrentTab();
    };

    function switchTab(name) {
      activeTab = name;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const selected = btn.innerText.includes(name);
        btn.className = `tab-btn px-4 py-2 font-medium border-b-2 ${selected ? "border-blue-600 text-blue-600" : "border-transparent text-gray-500 hover:text-blue-600"}`;
      });

      const actionBox = document.getElementById("actionBox");
      if (activeTab === "Stock in TW") {
        actionBox.classList.add("hidden");
      } else {
        actionBox.classList.remove("hidden");
        document.getElementById("panelTitle").innerText = `新增進出紀錄（分頁：${activeTab}）`;
      }
      fetchCurrentTab();
    }

    async function fetchCurrentTab() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">正在讀取 Google Sheets 資料...</td></tr>`;

      const targetUrl = activeTab === "Stock in TW" 
        ? `${GAS_ENDPOINT}?action=getStock` 
        : `${GAS_ENDPOINT}?action=getLogs&sheet=${encodeURIComponent(activeTab)}`;

      try {
        const res = await fetch(targetUrl);
        const result = await res.json();
        cachedData = result.data || [];
        renderTable(cachedData);
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500">無法連線至 Google Sheets，請確認 GAS 部署授權已設為「所有人」。</td></tr>`;
      }
    }

    function renderTable(rows) {
      const thead = document.getElementById("tableHead");
      const tbody = document.getElementById("tableBody");

      if (activeTab === "Stock in TW") {
        thead.innerHTML = `
          <tr>
            <th class="p-3">Location</th><th class="p-3">P/N</th><th class="p-3">Parts Name</th>
            <th class="p-3">QTY</th><th class="p-3">Model</th><th class="p-3">Remark</th>
          </tr>
        `;
        tbody.innerHTML = rows.map(r => `
          <tr class="hover:bg-gray-50">
            <td class="p-3 font-semibold">${r.location || '-'}</td>
            <td class="p-3 font-mono">${r.pn || '-'}</td>
            <td class="p-3">${r.partsName || '-'}</td>
            <td class="p-3 font-bold ${r.qty > 0 ? 'text-green-600' : 'text-red-500'}">${r.qty}</td>
            <td class="p-3 text-gray-500">${r.model || '-'}</td>
            <td class="p-3 text-gray-500">${r.remark || '-'}</td>
          </tr>
        `).join('');
      } else {
        thead.innerHTML = `
          <tr>
            <th class="p-3">Date</th><th class="p-3">P/N (If any)</th><th class="p-3">Parts Name</th>
            <th class="p-3">Model</th><th class="p-3 text-green-700">IN</th><th class="p-3 text-red-700">OUT</th><th class="p-3">Remark</th>
          </tr>
        `;
        tbody.innerHTML = rows.map(r => `
          <tr class="hover:bg-gray-50">
            <td class="p-3 text-gray-600">${r.date ? r.date.toString().substring(0, 10) : '-'}</td>
            <td class="p-3 font-mono">${r.pn || '-'}</td>
            <td class="p-3 font-medium">${r.partsName || '-'}</td>
            <td class="p-3 text-gray-500">${r.model || '-'}</td>
            <td class="p-3 text-green-600 font-semibold">${r.inQty}</td>
            <td class="p-3 text-red-600 font-semibold">${r.outQty}</td>
            <td class="p-3 text-gray-500">${r.remark || '-'}</td>
          </tr>
        `).join('');
      }
    }

    function applyFilter() {
      const q = document.getElementById("filterInput").value.trim().toLowerCase();
      const filtered = cachedData.filter(item => Object.values(item).some(val => String(val).toLowerCase().includes(q)));
      renderTable(filtered);
    }

    async function submitSingleRecord(e) {
      e.preventDefault();
      const payload = {
        action: "addRecord",
        sheet: activeTab,
        date: document.getElementById("rDate").value,
        pn: document.getElementById("rPn").value,
        partsName: document.getElementById("rName").value,
        model: document.getElementById("rModel").value,
        inQty: document.getElementById("rIn").value,
        outQty: document.getElementById("rOut").value,
        remark: document.getElementById("rRemark").value
      };

      await fetch(GAS_ENDPOINT, { method: "POST", body: JSON.stringify(payload) });
      alert("儲存成功！");
      document.getElementById("recordForm").reset();
      document.getElementById("rDate").value = new Date().toISOString().split("T")[0];
      fetchCurrentTab();
    }

    function uploadCSV(e) {
      const file = e.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: async function(res) {
          const records = res.data.map(row => ({
            date: row["Date"] || row["date"],
            pn: row["P/N (If any)"] || row["P/N"] || row["pn"],
            partsName: row["Parts Name"] || row["partsName"],
            model: row["Model"] || row["model"],
            inQty: row["IN"] || row["in"] || 0,
            outQty: row["OUT"] || row["out"] || 0,
            remark: row["Remark"] || row["remark"]
          }));

          await fetch(GAS_ENDPOINT, {
            method: "POST",
            body: JSON.stringify({ action: "batchImport", sheet: activeTab, records })
          });
          alert(`成功匯入 ${records.length} 筆資料！`);
          fetchCurrentTab();
        }
      });
    }
  </script>
</body>
</html>
