<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>零件庫房管理系統</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #f5f6f8; }
    .container { max-width: 1100px; margin: auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #1a1a1a; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }
    .tab-btn { padding: 8px 16px; border: none; background: #eee; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .tab-btn.active { background: #0066cc; color: white; }
    .panel { display: none; }
    .panel.active { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background: #f0f3f6; }
    .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .form-group input, .form-group select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn-import { background: #6f42c1; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

<div class="container">
  <h2>零件進出庫房管理系統</h2>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('stock')">庫存總覽 (stock in TW)</button>
    <button class="tab-btn" onclick="switchTab('entry')">進出庫登記 / 編輯</button>
    <button class="tab-btn" onclick="switchTab('import')">批次匯入資料</button>
  </div>

  <!-- 1. 總庫存面板 -->
  <div id="stockPanel" class="panel active">
    <button class="btn" onclick="loadStock()">重新整理庫存</button>
    <table id="stockTable">
      <thead>
        <tr>
          <th>Location</th><th>P/N</th><th>Parts Name</th><th>QTY (即時庫存)</th><th>Model</th><th>Remark</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 2. 進出庫錄入面板 -->
  <div id="entryPanel" class="panel">
    <h3>新增進出庫記錄</h3>
    <div class="form-group">
      <select id="targetSheet">
        <option value="S2">S2</option>
        <option value="S3">S3</option>
        <option value="S4">S4</option>
        <option value="S5">S5</option>
        <option value="S6">S6</option>
        <option value="DRY BOX">DRY BOX</option>
        <option value="clean room">clean room</option>
      </select>
      <input type="date" id="recDate">
      <input type="text" id="recPN" placeholder="P/N (If any)">
      <input type="text" id="recName" placeholder="Parts Name">
      <input type="text" id="recModel" placeholder="Model">
      <input type="number" id="recIn" placeholder="IN 數量" min="0">
      <input type="number" id="recOut" placeholder="OUT 數量" min="0">
      <input type="text" id="recRemark" placeholder="Remark">
      <button class="btn" onclick="submitRecord()">提交記錄</button>
    </div>
  </div>

  <!-- 3. CSV 匯入面板 -->
  <div id="importPanel" class="panel">
    <h3>批次匯入 CSV 至分頁</h3>
    <div class="form-group">
      <select id="importSheet">
        <option value="S2">S2</option>
        <option value="S3">S3</option>
        <option value="S4">S4</option>
        <option value="S5">S5</option>
        <option value="S6">S6</option>
        <option value="DRY BOX">DRY BOX</option>
        <option value="clean room">clean room</option>
      </select>
      <input type="file" id="csvFile" accept=".csv">
      <button class="btn btn-import" onclick="handleCSVUpload()">開始匯入</button>
    </div>
    <small>CSV 格式依序需為：Date, P/N, Parts Name, Model, IN, OUT, Remark</small>
  </div>
</div>

<script>
  // 替換為你的 Google Apps Script Web App 部署網址
  const GAS_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    if(tab === 'stock') {
      document.getElementById('stockPanel').classList.add('active');
      event.target.classList.add('active');
      loadStock();
    } else if(tab === 'entry') {
      document.getElementById('entryPanel').classList.add('active');
      event.target.classList.add('active');
    } else {
      document.getElementById('importPanel').classList.add('active');
      event.target.classList.add('active');
    }
  }

  // 讀取 stock in TW 庫存
  async function loadStock() {
    const tbody = document.querySelector("#stockTable tbody");
    tbody.innerHTML = "<tr><td colspan='6'>載入中...</td></tr>";
    try {
      const res = await fetch(`${GAS_URL}?action=getStock`);
      const result = await res.json();
      tbody.innerHTML = "";
      result.data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.location || ""}</td>
          <td>${row["P/N"] || ""}</td>
          <td>${row["parts name"] || ""}</td>
          <td><strong>${row.QTY !== undefined ? row.QTY : 0}</strong></td>
          <td>${row.model || ""}</td>
          <td>${row.remark || ""}</td>
        `;
        tbody.appendChild(tr);
      });
    } catch(err) {
      tbody.innerHTML = "<tr><td colspan='6'>讀取失敗，請確認 API URL 與權限。</td></tr>";
    }
  }

  // 提交單筆資料
  async function submitRecord() {
    const payload = {
      action: "addRecord",
      sheet: document.getElementById("targetSheet").value,
      date: document.getElementById("recDate").value,
      pn: document.getElementById("recPN").value,
      partsName: document.getElementById("recName").value,
      model: document.getElementById("recModel").value,
      in: document.getElementById("recIn").value,
      out: document.getElementById("recOut").value,
      remark: document.getElementById("recRemark").value
    };

    const res = await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if(result.status === "success") {
      alert("記錄新增成功！");
      document.querySelectorAll('#entryPanel input').forEach(i => i.value = "");
    } else {
      alert("提交失敗: " + result.message);
    }
  }

  // 匯入 CSV
  function handleCSVUpload() {
    const file = document.getElementById("csvFile").files[0];
    const sheetName = document.getElementById("importSheet").value;
    if(!file) return alert("請先選擇 CSV 檔案");

    const reader = new FileReader();
    reader.onload = async function(e) {
      const text = e.target.result;
      const rows = text.split("\n").filter(r => r.trim() !== "").map(r => r.split(",").map(c => c.trim()));
      // 排除第一列標題列（如果有的話）
      if (rows[0][0].toLowerCase().includes("date")) rows.shift();

      const res = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "batchImport", sheet: sheetName, rows: rows })
      });
      const result = await res.json();
      if(result.status === "success") {
        alert(`成功匯入 ${result.count} 筆資料！`);
      } else {
        alert("匯入失敗: " + result.message);
      }
    };
    reader.readAsText(file);
  }

  // 初始化今日日期與讀取庫存
  document.getElementById("recDate").value = new Date().toISOString().split('T')[0];
  loadStock();
</script>

</body>
</html>
