<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣庫存管控系統 - TW Parts Management</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg p-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <i data-lucide="box"></i> 台灣零件庫存管控系統
      </h1>
      <button onclick="openModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium shadow flex items-center gap-1 transition">
        <i data-lucide="plus-circle"></i> 登記零件進/出庫
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto p-6 space-y-6">
    
    <!-- 數據概覽卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <p class="text-slate-500 text-sm font-medium">總零件品項數</p>
        <h2 id="total-items" class="text-3xl font-bold text-slate-800 mt-2">--</h2>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <p class="text-slate-500 text-sm font-medium">總庫存數量</p>
        <h2 id="total-qty" class="text-3xl font-bold text-indigo-600 mt-2">--</h2>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <p class="text-slate-500 text-sm font-medium">低庫存警戒</p>
        <h2 id="low-stock" class="text-3xl font-bold text-amber-500 mt-2">--</h2>
      </div>
    </div>

    <!-- 搜尋與篩選 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 justify-between">
      <input type="text" id="search-input" placeholder="搜尋料號 P/N、零件名稱、機型..." class="w-full md:w-96 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
      <select id="location-filter" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        <option value="">所有位置 (Location)</option>
        <option value="S1">S1</option>
        <option value="S2">S2</option>
        <option value="DRY BOX">Dry Box</option>
      </select>
    </div>

    <!-- 表格展示 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead class="bg-slate-100 text-slate-600 text-sm uppercase">
          <tr>
            <th class="p-4">位置 (Location)</th>
            <th class="p-4">料號 (P/N)</th>
            <th class="p-4">零件名稱 (Parts Name)</th>
            <th class="p-4">機型 (Model)</th>
            <th class="p-4">目前數量 (QTY)</th>
            <th class="p-4">備註 (Remark)</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-slate-100 text-sm">
          <!-- 資料動態載入 -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const GAS_API_URL = "您的_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    // 初始化與載入資料
    async function loadData() {
      try {
        const res = await fetch(GAS_API_URL);
        const data = await res.json();
        renderTable(data);
      } catch (err) {
        console.error("載入失敗:", err);
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = data.map(item => `
        <tr class="hover:bg-slate-50 transition">
          <td class="p-4 font-semibold text-slate-700">${item['Location'] || '-'}</td>
          <td class="p-4 font-mono text-indigo-600">${item['P/N (If any)'] || item['P/N'] || '-'}</td>
          <td class="p-4">${item['Parts Name'] || '-'}</td>
          <td class="p-4">${item['Model'] || '-'}</td>
          <td class="p-4"><span class="px-2 py-1 rounded bg-slate-100 font-bold">${item['QTY'] || 0}</span></td>
          <td class="p-4 text-slate-500">${item['Remark'] || '-'}</td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    window.onload = () => {
      lucide.createIcons();
      // loadData(); // 填上 GAS URL 後開啟
    };
  </script>
</body>
</html>
