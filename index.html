<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>零件庫房進出管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-16">

  <!-- 頂部導航 -->
  <nav class="bg-slate-900 text-white shadow sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-boxes-stacked text-indigo-400 text-2xl"></i>
        <div>
          <h1 class="text-base sm:text-lg font-bold">零件庫房進出管理系統</h1>
          <p class="text-xs text-slate-400">P/N+品名跨庫房同件歸併 ｜ 匯入直接覆寫 ｜ 純數字時間格式</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchCurrentTab()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-xs font-semibold rounded shadow flex items-center gap-1.5 transition">
          <i class="fa-solid fa-rotate"></i> 重新載入
        </button>
        <button onclick="exportToExcel()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-xs font-semibold rounded shadow flex items-center gap-1.5 transition">
          <i class="fa-solid fa-file-excel"></i> 匯出目前分頁 Excel
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

    <!-- 8 大分頁切換按鈕 -->
    <div class="bg-white p-2 rounded-xl shadow-sm border border-slate-200 overflow-x-auto flex gap-1.5" id="tabGroup">
      <button onclick="switchTab('Stock in TW')" id="tab-Stock-in-TW" class="tab-btn px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition bg-indigo-50 text-indigo-700 border border-indigo-200">
        <i class="fa-solid fa-warehouse mr-1.5"></i>Stock in TW (總庫存)
      </button>
      <button onclick="switchTab('S2')" id="tab-S2" class="tab-btn px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 transition">S2</button>
      <button onclick="switchTab('S3')" id="tab-S3" class="tab-btn px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 transition">S3</button>
      <button onclick="switchTab('S4')" id="tab-S4" class="tab-btn px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 transition">S4</button>
      <button onclick="switchTab('S5')" id="tab-S5" class="tab-btn px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 transition">S5</button>
      <button onclick="switchTab('S6')" id="tab-S6" class="tab-btn px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 transition">S6</button>
      <button onclick="switchTab('DRY BOX')" id="tab-DRY-BOX" class="tab-btn px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 transition">DRY BOX</button>
      <button onclick="switchTab('clean room')" id="tab-clean-room" class="tab-btn px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 transition">clean room</button>
    </div>

    <!-- 摘要指標卡片 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500">項目總數</p>
          <p class="text-2xl font-bold text-slate-800" id="statTotalItems">0</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-lg"><i class="fa-solid fa-list-ol"></i></div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500" id="statLabel2">在庫品項數</p>
          <p class="text-2xl font-bold text-emerald-600" id="statInStock">0</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg"><i class="fa-solid fa-cubes"></i></div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500" id="statLabel3">缺料 / 零庫存品項</p>
          <p class="text-2xl font-bold text-rose-500" id="statOutStock">0</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center text-lg"><i class="fa-solid fa-triangle-exclamation"></i></div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500">當前工作分頁</p>
          <p class="text-base sm:text-lg font-bold text-indigo-600 truncate" id="statCurrentTab">Stock in TW</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg"><i class="fa-solid fa-folder-open"></i></div>
      </div>
    </div>

    <!-- 頂部操作區（新增與覆寫匯入） -->
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex flex-wrap justify-between items-center pb-3 border-b border-slate-100 gap-3">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
          <h3 class="font-bold text-sm text-slate-800">
            目前分頁：<span id="bannerTabName" class="text-indigo-600">Stock in TW</span>
          </h3>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="openAddModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5">
            <i class="fa-solid fa-plus-circle"></i> <span id="btnAddBtnText">新增庫存品項</span>
          </button>
        </div>
      </div>

      <!-- CSV 批次覆寫匯入區塊 -->
      <div class="flex flex-wrap items-center justify-between gap-3 bg-amber-50/70 p-3.5 rounded-lg border border-amber-200">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-file-arrow-up text-amber-600 text-2xl"></i>
          <div>
            <p class="text-xs font-bold text-slate-800">
              批次 CSV 檔案匯入（<span class="text-amber-700 font-extrabold underline">直接覆寫舊資料，不累加</span>）至 <span id="importTargetLabel" class="text-indigo-700 font-bold">Stock in TW</span>：
            </p>
            <p class="text-[11px] text-slate-500" id="importColsHint">支援欄位：Location, P/N, parts name, QTY, model, remark</p>
          </div>
        </div>
        <input type="file" id="csvFileInput" accept=".csv" onchange="handleCSVFile(event)" class="text-xs text-slate-600 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer">
      </div>
    </div>

    <!-- 搜尋工具列 -->
    <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="relative w-full sm:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="searchKeyword" oninput="applyFilter()" placeholder="快速搜尋料號、品名、型號、庫房..." class="w-full pl-9 pr-4 py-2 text-sm bg-white border border-slate-200 rounded-lg shadow-sm focus:outline-none focus:border-indigo-500">
      </div>
      <div class="text-xs text-slate-500 font-medium self-end sm:self-center">
        共顯示 <span id="filteredCount" class="font-bold text-slate-800">0</span> 筆資料
      </div>
    </div>

    <!-- 資料呈現表格 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm" id="mainDataTable">
          <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase tracking-wider" id="tableHeader"></thead>
          <tbody class="divide-y divide-slate-100" id="tableContent">
            <tr>
              <td colspan="8" class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-500 block"></i>
                正在連線至 Google Sheets 同步中...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- 新增彈窗 (Add Modal) -->
  <div id="addModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100">
        <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-indigo-600"></i> <span id="addModalTitle">新增項目</span>
        </h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
      </div>

      <form id="addForm" onsubmit="handleAddSubmit(event)" class="space-y-3 text-sm">
        <!-- Stock in TW 專用欄位 -->
        <div id="stockOnlyFields" class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Location 存放庫房 *</label>
            <select id="addLocation" class="w-full border rounded p-2 text-sm bg-white">
              <option value="S2">S2</option>
              <option value="S3">S3</option>
              <option value="S4">S4</option>
              <option value="S5">S5</option>
              <option value="S6">S6</option>
              <option value="DRY BOX">DRY BOX</option>
              <option value="clean room">clean room</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">QTY 底表數量</label>
            <input type="number" id="addStockQty" value="1" min="0" class="w-full border rounded p-2 text-sm">
          </div>
        </div>

        <!-- 庫房流水帳專用欄位 (純數字日期) -->
        <div id="logOnlyFields" class="hidden">
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Date 日期 (YYYY-MM-DD)</label>
              <input type="date" id="addDate" class="w-full border rounded p-2 text-sm font-mono">
            </div>
            <div>
              <label class="block text-xs font-semibold text-emerald-600 mb-1">IN (入庫數)</label>
              <input type="number" id="addInQty" min="0" value="0" class="w-full border rounded p-2 text-sm font-mono">
            </div>
            <div>
              <label class="block text-xs font-semibold text-rose-500 mb-1">OUT (出庫數)</label>
              <input type="number" id="addOutQty" min="0" value="0" class="w-full border rounded p-2 text-sm font-mono">
            </div>
          </div>
        </div>

        <!-- 通用欄位 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">P/N 料號</label>
          <input type="text" id="addPn" placeholder="例如 560-5521" class="w-full border rounded p-2 text-sm font-mono">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Parts Name 零件品名 *</label>
          <input type="text" id="addPartsName" placeholder="必填" class="w-full border rounded p-2 text-sm font-medium" required>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Model 機種/型號</label>
          <input type="text" id="addModel" placeholder="例如 CG4100" class="w-full border rounded p-2 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Remark 備註</label>
          <input type="text" id="addRemark" placeholder="說明事由" class="w-full border rounded p-2 text-sm">
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-50 text-xs font-semibold">取消</button>
          <button type="submit" id="btnSaveAdd" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow">確認儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 編輯彈窗 (Edit Modal) -->
  <div id="editModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100">
        <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-indigo-600"></i> 編輯明細資料
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
      </div>

      <form id="editForm" onsubmit="handleEditSubmit(event)" class="space-y-3 text-sm">
        <input type="hidden" id="editRowId">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Date 日期 (YYYY-MM-DD)</label>
            <input type="date" id="editDate" class="w-full border rounded p-2 text-sm font-mono" required>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">P/N 料號</label>
            <input type="text" id="editPn" class="w-full border rounded p-2 text-sm font-mono">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Parts Name 品名 *</label>
          <input type="text" id="editPartsName" class="w-full border rounded p-2 text-sm font-medium" required>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Model 型號</label>
          <input type="text" id="editModel" class="w-full border rounded p-2 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-emerald-600 mb-1">IN (入庫數)</label>
            <input type="number" id="editInQty" min="0" class="w-full border rounded p-2 text-sm font-mono">
          </div>
          <div>
            <label class="block text-xs font-semibold text-rose-500 mb-1">OUT (出庫數)</label>
            <input type="number" id="editOutQty" min="0" class="w-full border rounded p-2 text-sm font-mono">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Remark 備註</label>
          <input type="text" id="editRemark" class="w-full border rounded p-2 text-sm">
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-50 text-xs font-semibold">取消</button>
          <button type="submit" id="btnSaveEdit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow">儲存修改</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    /**
     * 【設定區】請填入您部署的 Google Apps Script Web App URL (結尾必須為 /exec)
     */
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwy13r5p6BA9cmxgvzsjnIEc-G4qi2nSEoubLngeSt1gw_gaPB2gvdMIC1UDNP2ELb5aQ/exec";

    let currentTab = "Stock in TW";
    let rawDataList = [];

    // 日期格式化純數字 (YYYY-MM-DD)
    function cleanDateStr(val) {
      if (!val) return '';
      const s = String(val).trim();
      if (!s || s.toLowerCase() === 'nan' || s.toLowerCase() === 'nat') return '';
      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }
      return s.substring(0, 10).replace(/\//g, '-');
    }

    window.onload = () => {
      document.getElementById("addDate").value = new Date().toISOString().split("T")[0];
      switchTab("Stock in TW");
    };

    // JSONP 跨域呼叫
    function fetchJSONP(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'gasCallback_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("連線逾時，請確認 Apps Script 權限設為『所有人』"));
        }, 15000);

        function cleanup() {
          if (window[callbackName]) delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          clearTimeout(timer);
        }

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
        script.onerror = function() {
          cleanup();
          reject(new Error("載入失敗"));
        };
        document.body.appendChild(script);
      });
    }

    // 分頁切換
    function switchTab(sheetName) {
      currentTab = sheetName;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.className = "tab-btn px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:bg-slate-100 transition";
      });
      const activeId = "tab-" + sheetName.replace(/\s+/g, '-');
      const activeBtn = document.getElementById(activeId);
      if (activeBtn) {
        activeBtn.className = "tab-btn px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition bg-indigo-50 text-indigo-700 border border-indigo-200";
      }

      document.getElementById("statCurrentTab").innerText = currentTab;
      document.getElementById("bannerTabName").innerText = currentTab;
      document.getElementById("importTargetLabel").innerText = currentTab;

      if (currentTab === "Stock in TW") {
        document.getElementById("btnAddBtnText").innerText = "＋ 新增庫存品項";
        document.getElementById("importColsHint").innerText = "支援欄位：Location, P/N, parts name, QTY, model, remark";
      } else {
        document.getElementById("btnAddBtnText").innerText = `＋ 新增 ${currentTab} 零件紀錄`;
        document.getElementById("importColsHint").innerText = "支援欄位：Date, P/N (If any), Parts Name, Model, IN, OUT, Remark";
      }

      fetchCurrentTab();
    }

    // 取得資料
    async function fetchCurrentTab() {
      const tbody = document.getElementById("tableContent");
      tbody.innerHTML = `<tr><td colspan="8" class="text-center py-12 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-500 block"></i>正在從 Google Sheets 同步資料...</td></tr>`;

      const targetUrl = currentTab === "Stock in TW"
        ? `${GAS_API_URL}?action=getStock`
        : `${GAS_API_URL}?action=getLogs&sheet=${encodeURIComponent(currentTab)}`;

      try {
        const result = await fetchJSONP(targetUrl);
        if (result.status === 'success') {
          rawDataList = result.data || [];
          renderTable(rawDataList);
          updateStatistics(rawDataList);
        } else {
          throw new Error(result.message || "讀取失敗");
        }
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-12 text-rose-500">
              <i class="fa-solid fa-triangle-exclamation text-3xl mb-2 block"></i>
              <p class="font-bold">連線失敗：${err.message}</p>
            </td>
          </tr>
        `;
      }
    }

    // 渲染表格
    function renderTable(data) {
      const thead = document.getElementById("tableHeader");
      const tbody = document.getElementById("tableContent");
      document.getElementById("filteredCount").innerText = data.length;

      if (currentTab === "Stock in TW") {
        thead.innerHTML = `
          <tr>
            <th class="px-4 py-3">Location (庫房)</th>
            <th class="px-4 py-3">P/N (料號)</th>
            <th class="px-4 py-3">Parts Name (品名)</th>
            <th class="px-4 py-3">QTY (總在庫數 = IN - OUT)</th>
            <th class="px-4 py-3">Model</th>
            <th class="px-4 py-3">Remark</th>
          </tr>
        `;
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">目前尚無庫存資料</td></tr>`;
          return;
        }
        tbody.innerHTML = data.map(r => `
          <tr class="hover:bg-slate-50 transition border-b border-slate-100">
            <td class="px-4 py-3 font-semibold text-slate-700">${r.location || '-'}</td>
            <td class="px-4 py-3 font-mono text-xs text-slate-600">${r.pn || '-'}</td>
            <td class="px-4 py-3 font-medium text-slate-900">${r.partsName || '-'}</td>
            <td class="px-4 py-3 font-bold ${r.qty > 0 ? 'text-emerald-600' : 'text-rose-500'}">${r.qty}</td>
            <td class="px-4 py-3 text-slate-500 text-xs">${r.model || '-'}</td>
            <td class="px-4 py-3 text-slate-500 text-xs">${r.remark || '-'}</td>
          </tr>
        `).join('');
      } else {
        thead.innerHTML = `
          <tr>
            <th class="px-4 py-3">Date (日期)</th>
            <th class="px-4 py-3">P/N (If any)</th>
            <th class="px-4 py-3">Parts Name</th>
            <th class="px-4 py-3">Model</th>
            <th class="px-4 py-3 text-emerald-600 font-bold">IN</th>
            <th class="px-4 py-3 text-rose-500 font-bold">OUT</th>
            <th class="px-4 py-3">Remark</th>
            <th class="px-4 py-3 text-right">操作</th>
          </tr>
        `;
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-slate-400">此分頁尚無進出紀錄</td></tr>`;
          return;
        }
        tbody.innerHTML = data.map(r => `
          <tr class="hover:bg-slate-50 transition border-b border-slate-100">
            <td class="px-4 py-3 text-xs text-slate-600 font-mono font-bold">${cleanDateStr(r.date) || '-'}</td>
            <td class="px-4 py-3 font-mono text-xs text-slate-600">${r.pn || '-'}</td>
            <td class="px-4 py-3 font-medium text-slate-900">${r.partsName || '-'}</td>
            <td class="px-4 py-3 text-slate-500 text-xs">${r.model || '-'}</td>
            <td class="px-4 py-3 font-bold text-emerald-600 font-mono">${r.inQty}</td>
            <td class="px-4 py-3 font-bold text-rose-500 font-mono">${r.outQty}</td>
            <td class="px-4 py-3 text-slate-500 text-xs">${r.remark || '-'}</td>
            <td class="px-4 py-3 text-right space-x-1">
              <button onclick='openEditModal(${JSON.stringify(r)})' class="text-indigo-600 hover:text-indigo-800 text-xs font-semibold px-2 py-1 rounded hover:bg-indigo-50 transition">
                <i class="fa-solid fa-pen"></i> 編輯
              </button>
              <button onclick="deleteRecord(${r.rowId})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold px-2 py-1 rounded hover:bg-rose-50 transition">
                <i class="fa-solid fa-trash-can"></i> 刪除
              </button>
            </td>
          </tr>
        `).join('');
      }
    }

    // 關鍵字搜尋
    function applyFilter() {
      const kw = document.getElementById("searchKeyword").value.trim().toLowerCase();
      if (!kw) {
        renderTable(rawDataList);
        return;
      }
      const filtered = rawDataList.filter(item => 
        Object.values(item).some(v => String(v).toLowerCase().includes(kw))
      );
      renderTable(filtered);
    }

    // 統計卡片
    function updateStatistics(data) {
      document.getElementById("statTotalItems").innerText = data.length;
      if (currentTab === "Stock in TW") {
        document.getElementById("statLabel2").innerText = "在庫品項數";
        document.getElementById("statLabel3").innerText = "缺料 / 零庫存品項";
        const inStockCount = data.filter(d => Number(d.qty) > 0).length;
        document.getElementById("statInStock").innerText = inStockCount;
        document.getElementById("statOutStock").innerText = data.length - inStockCount;
      } else {
        document.getElementById("statLabel2").innerText = "累計入庫數 (IN)";
        document.getElementById("statLabel3").innerText = "累計出庫數 (OUT)";
        const totalIn = data.reduce((acc, cur) => acc + (Number(cur.inQty) || 0), 0);
        const totalOut = data.reduce((acc, cur) => acc + (Number(cur.outQty) || 0), 0);
        document.getElementById("statInStock").innerText = totalIn;
        document.getElementById("statOutStock").innerText = totalOut;
      }
    }

    // 新增彈窗
    function openAddModal() {
      document.getElementById("addForm").reset();
      document.getElementById("addDate").value = new Date().toISOString().split("T")[0];

      if (currentTab === "Stock in TW") {
        document.getElementById("addModalTitle").innerText = "新增庫存品項 (Stock in TW)";
        document.getElementById("stockOnlyFields").classList.remove("hidden");
        document.getElementById("logOnlyFields").classList.add("hidden");
      } else {
        document.getElementById("addModalTitle").innerText = `新增明細紀錄 (${currentTab})`;
        document.getElementById("stockOnlyFields").classList.add("hidden");
        document.getElementById("logOnlyFields").classList.remove("hidden");
      }
      document.getElementById("addModal").classList.remove("hidden");
    }

    function closeAddModal() {
      document.getElementById("addModal").classList.add("hidden");
    }

    // 新增提交
    async function handleAddSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSaveAdd");
      btn.disabled = true;
      btn.innerText = "儲存中...";

      let payload = {};
      if (currentTab === "Stock in TW") {
        payload = {
          action: "addRecord",
          sheet: "Stock in TW",
          location: document.getElementById("addLocation").value,
          pn: document.getElementById("addPn").value.trim(),
          partsName: document.getElementById("addPartsName").value.trim(),
          qty: Number(document.getElementById("addStockQty").value) || 0,
          model: document.getElementById("addModel").value.trim(),
          remark: document.getElementById("addRemark").value.trim()
        };
      } else {
        payload = {
          action: "addRecord",
          sheet: currentTab,
          date: cleanDateStr(document.getElementById("addDate").value),
          pn: document.getElementById("addPn").value.trim(),
          partsName: document.getElementById("addPartsName").value.trim(),
          model: document.getElementById("addModel").value.trim(),
          inQty: Number(document.getElementById("addInQty").value) || 0,
          outQty: Number(document.getElementById("addOutQty").value) || 0,
          remark: document.getElementById("addRemark").value.trim()
        };
      }

      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        closeAddModal();
        alert("新增成功！");
        setTimeout(fetchCurrentTab, 1500);
      } catch (err) {
        alert("新增失敗：" + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "確認儲存";
      }
    }

    // 編輯彈窗
    function openEditModal(record) {
      document.getElementById("editRowId").value = record.rowId;
      document.getElementById("editDate").value = cleanDateStr(record.date) || new Date().toISOString().split("T")[0];
      document.getElementById("editPn").value = record.pn || '';
      document.getElementById("editPartsName").value = record.partsName || '';
      document.getElementById("editModel").value = record.model || '';
      document.getElementById("editInQty").value = record.inQty || 0;
      document.getElementById("editOutQty").value = record.outQty || 0;
      document.getElementById("editRemark").value = record.remark || '';
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeEditModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    // 編輯提交
    async function handleEditSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSaveEdit");
      btn.disabled = true;
      btn.innerText = "儲存中...";

      const payload = {
        action: "updateRecord",
        sheet: currentTab,
        rowId: document.getElementById("editRowId").value,
        date: cleanDateStr(document.getElementById("editDate").value),
        pn: document.getElementById("editPn").value.trim(),
        partsName: document.getElementById("editPartsName").value.trim(),
        model: document.getElementById("editModel").value.trim(),
        inQty: Number(document.getElementById("editInQty").value) || 0,
        outQty: Number(document.getElementById("editOutQty").value) || 0,
        remark: document.getElementById("editRemark").value.trim()
      };

      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        closeEditModal();
        alert("修改成功！");
        setTimeout(fetchCurrentTab, 1500);
      } catch (err) {
        alert("修改失敗：" + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "儲存修改";
      }
    }

    // 刪除
    async function deleteRecord(rowId) {
      if (!confirm(`確定要刪除第 ${rowId} 列這筆明細嗎？`)) return;
      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "deleteRow", sheet: currentTab, rowId: rowId })
        });
        setTimeout(fetchCurrentTab, 1500);
      } catch (err) {
        alert("刪除失敗：" + err.message);
      }
    }

    // 批次 CSV 覆寫匯入 (Overwrite)
    function handleCSVFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (!confirm(`⚠️ 注意：匯入 CSV 將會「直接覆寫」目前【${currentTab}】分頁的全部資料，不進行疊加，確定繼續？`)) {
        e.target.value = "";
        return;
      }

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: async function(results) {
          let records = [];

          if (currentTab === "Stock in TW") {
            records = results.data.map(r => ({
              location: r["Location"] || r["location"] || "",
              pn: r["P/N"] || r["P/N (If any)"] || r["pn"] || "",
              partsName: r["parts name"] || r["Parts Name"] || r["partsName"] || "",
              qty: Number(r["QTY"] || r["qty"] || 0),
              model: r["model"] || r["Model"] || "",
              remark: r["remark"] || r["Remark"] || ""
            })).filter(r => r.partsName !== "");
          } else {
            records = results.data.map(r => ({
              date: cleanDateStr(r["Date"] || r["date"] || ""),
              pn: r["P/N (If any)"] || r["P/N"] || r["pn"] || "",
              partsName: r["Parts Name"] || r["partsName"] || "",
              model: r["Model"] || r["model"] || "",
              inQty: Number(r["IN"] || r["in"] || 0),
              outQty: Number(r["OUT"] || r["out"] || 0),
              remark: r["Remark"] || r["remark"] || ""
            })).filter(r => r.partsName !== "");
          }

          if (records.length === 0) {
            alert("CSV 內容為空或欄位不符！");
            return;
          }

          await fetch(GAS_API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "batchImportOverwrite",
              sheet: currentTab,
              records: records
            })
          });

          alert(`已成功覆寫匯入 ${records.length} 筆資料！`);
          e.target.value = "";
          setTimeout(fetchCurrentTab, 2000);
        }
      });
    }

    // 匯出 Excel
    function exportToExcel() {
      if (rawDataList.length === 0) {
        alert("目前分頁無資料可匯出！");
        return;
      }
      const ws = XLSX.utils.json_to_sheet(rawDataList);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, currentTab);
      XLSX.writeFile(wb, `${currentTab}_${new Date().toISOString().split("T")[0]}.xlsx`);
    }
  </script>
</body>
</html>
