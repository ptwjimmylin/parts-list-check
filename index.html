<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣零件庫存管控系統 PRO v2.8 (Full Feature)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS (用於解析 Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- 檔案上傳輸入框 (隱藏) -->
  <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleFileImport(event)">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-md shadow-indigo-100">
          <i data-lucide="boxes" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-slate-900 text-lg leading-tight">台灣零件庫存管控系統</h1>
            <span class="px-2 py-0.5 text-xs font-semibold bg-indigo-50 text-indigo-600 rounded-md border border-indigo-100">PRO v2.8</span>
          </div>
          <p class="text-xs text-slate-500">Stock Control • Deduplicated Auto Import • Live Sheet Sync</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <!-- 匯入 Excel -->
        <button onclick="triggerFileInput()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg border border-emerald-300 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 text-xs font-semibold transition shadow-sm">
          <i data-lucide="upload" class="w-4 h-4 text-emerald-600"></i>
          <span>匯入 Excel 檔案</span>
        </button>

        <!-- Google Sheet 同步設定按鈕 -->
        <button onclick="toggleSyncPanel()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-medium transition">
          <i data-lucide="cloud" class="w-4 h-4 text-sky-500"></i>
          <span>Google Sheet 同步</span>
          <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-slate-300 ml-1"></span>
        </button>

        <!-- 匯出 CSV -->
        <button onclick="exportCSV()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-medium transition">
          <i data-lucide="download" class="w-4 h-4 text-slate-500"></i>
          <span>匯出 CSV</span>
        </button>

        <!-- 新增記錄按鈕 -->
        <button onclick="openModal()" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-lg text-xs font-medium shadow-md shadow-indigo-100 transition">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>手動新增資料</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Google Sheet API 同步面板 -->
  <div id="sync-panel" class="hidden bg-slate-900 text-white border-b border-slate-800 p-4 transition-all">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <i data-lucide="key" class="w-5 h-5 text-indigo-400"></i>
        <div>
          <p class="text-sm font-semibold">Google Apps Script Web App URL 連結設定</p>
          <p class="text-xs text-slate-400">貼上部署後取得的 Web App URL，新增資料時會自動同步寫入 Google Sheet</p>
        </div>
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <input type="text" id="gas-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full md:w-96 px-3 py-1.5 rounded-lg text-xs bg-slate-800 border border-slate-700 text-slate-200 focus:outline-none focus:border-indigo-500 font-mono">
        <button onclick="saveGasUrl()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-medium rounded-lg whitespace-nowrap">儲存 URL 設定</button>
      </div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6">

    <!-- 指標統計卡片 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="glass-card p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">總筆數 (TOTAL ROWS)</p>
          <h3 id="stat-total-items" class="text-3xl font-extrabold text-slate-800 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600">
          <i data-lucide="layers" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="glass-card p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">總欄位數 (COLUMNS)</p>
          <h3 id="stat-total-cols" class="text-3xl font-extrabold text-indigo-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600">
          <i data-lucide="columns" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="glass-card p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">在地總數量 (TOTAL QTY)</p>
          <h3 id="stat-total-qty" class="text-3xl font-extrabold text-emerald-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-600">
          <i data-lucide="package-check" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="glass-card p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">目前頁籤 (SHEET)</p>
          <h3 id="stat-sheet-name" class="text-xl font-bold text-sky-600 mt-2 truncate">-</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-sky-50 flex items-center justify-center text-sky-600">
          <i data-lucide="file-spreadsheet" class="w-6 h-6"></i>
        </div>
      </div>
    </div>

    <!-- Sheet 頁籤區 -->
    <div class="space-y-4 pt-2">
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-3">
        <div class="flex flex-wrap items-center gap-1.5" id="sheet-tabs-container">
          <!-- 動態頁籤按鈕 -->
        </div>

        <span id="filtered-count" class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-xl whitespace-nowrap">
          顯示: 0 筆
        </span>
      </div>

      <!-- 搜尋 Bar -->
      <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3">
        <div class="relative w-full">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="搜尋目前 Sheet 中的所有關鍵字..." class="w-full pl-10 pr-4 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>
      </div>
    </div>

    <!-- 表格區 -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr id="dynamic-thead" class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
            </tr>
          </thead>
          <tbody id="dynamic-tbody" class="divide-y divide-slate-100 text-xs">
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- 手動新增 / 編輯資料 Modal -->
  <div id="item-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-lg overflow-hidden transition-all">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4 text-indigo-600"></i>
          <span>新增庫存 / 零件資料</span>
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="item-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">庫位 (LOCATION)</label>
            <input type="text" id="form-location" value="S6" placeholder="例如: S6" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">機型 (MODEL)</label>
            <input type="text" id="form-model" placeholder="例如: 88xx/92xx" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 (PARTS NAME)</label>
          <input type="text" id="form-parts-name" required placeholder="例如: Rotation unit Magnetic seal" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">庫存 (QTY)</label>
            <input type="number" id="form-qty" value="1" min="0" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center font-bold">
          </div>
          <div>
            <label class="block text-xs font-semibold text-emerald-600 mb-1">進貨 (+IN)</label>
            <input type="number" id="form-in" value="0" min="0" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center">
          </div>
          <div>
            <label class="block text-xs font-semibold text-amber-600 mb-1">出貨 (-OUT)</label>
            <input type="number" id="form-out" value="0" min="0" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">備註 (REMARK)</label>
          <input type="text" id="form-remark" placeholder="例如: to UMC 12A" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="pt-2 flex items-center justify-end gap-3 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">取消</button>
          <button type="submit" class="px-5 py-2 text-xs font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md shadow-indigo-100 transition">新增並同步寫入</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 預設預載資料
    let allSheetData = {
      'Stock in TW': [
        { 'LOCATION': 'S6', 'PARTS NAME': 'Rotation unit Magnetic seal', 'MODEL': '88xx/92xx', 'QTY': 1, 'IN': 0, 'OUT': 0, 'DATE': '2026/04/09', 'REMARK': 'to UMC 12A' },
        { 'LOCATION': 'S6', 'PARTS NAME': 'SSCNT PCB', 'MODEL': 'CG4100', 'QTY': 1, 'IN': 0, 'OUT': 1, 'DATE': '2026/04/09', 'REMARK': 'to UMC 12A' },
        { 'LOCATION': 'S1', 'PARTS NAME': 'PE2 gauge cable', 'MODEL': 'All Model', 'QTY': 1, 'IN': 0, 'OUT': 0, 'DATE': '2026/04/01', 'REMARK': 'Engineers repair tools' }
      ]
    };

    let dynamicHeaders = ['LOCATION', 'PARTS NAME', 'MODEL', 'QTY', 'IN', 'OUT', 'DATE', 'REMARK'];
    let currentSheetName = 'Stock in TW';
    let currentRows = [...allSheetData['Stock in TW']];

    const locationBadges = {
      'S1': 'bg-teal-50 text-teal-700 border-teal-200',
      'S2': 'bg-amber-50 text-amber-700 border-amber-200',
      'S3': 'bg-sky-50 text-sky-700 border-sky-200',
      'S4': 'bg-cyan-50 text-cyan-700 border-cyan-200',
      'S5': 'bg-indigo-50 text-indigo-700 border-indigo-200',
      'S6': 'bg-rose-50 text-rose-700 border-rose-200',
      'DRY BOX': 'bg-purple-50 text-purple-700 border-purple-200',
      'Clean room': 'bg-emerald-50 text-emerald-700 border-emerald-200'
    };

    function triggerFileInput() {
      document.getElementById('excel-file-input').click();
    }

    // 匯入 Excel 邏輯 (不重複計算)
    function handleFileImport(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          allSheetData = {};

          workbook.SheetNames.forEach(sheetName => {
            const worksheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            if (!json || json.length < 2) return;

            let headerIdx = -1;
            for (let i = 0; i < Math.min(json.length, 15); i++) {
              if (json[i] && json[i].filter(c => c !== undefined && c !== '').length >= 2) {
                headerIdx = i;
                break;
              }
            }

            if (headerIdx === -1) return;

            const rawHeaders = json[headerIdx]
              .map((h, idx) => h ? String(h).trim() : `COLUMN_${idx + 1}`)
              .filter(h => h !== '');

            const rowsData = json.slice(headerIdx + 1);
            let sheetRows = [];

            rowsData.forEach(row => {
              if (!row || row.length === 0) return;
              let rowObj = {};
              let isNonEmpty = false;

              rawHeaders.forEach((header, cIdx) => {
                let cellVal = row[cIdx];
                if (cellVal !== undefined && cellVal !== null && String(cellVal).trim() !== '') {
                  isNonEmpty = true;
                  cellVal = formatExcelDate(cellVal);
                } else {
                  cellVal = '';
                }
                rowObj[header] = cellVal;
              });

              if (isNonEmpty) sheetRows.push(rowObj);
            });

            if (sheetRows.length > 0) {
              allSheetData[sheetName] = sheetRows;
            }
          });

          const sheetKeys = Object.keys(allSheetData);
          if (sheetKeys.length > 0) {
            renderSheetTabs(sheetKeys);
            switchSheet(sheetKeys[0]);
            alert(`成功載入！共讀取 ${sheetKeys.length} 個工作表。`);
          } else {
            alert('未能辨識到有效的表格資料！');
          }

        } catch (err) {
          alert('解析 Excel 檔案失敗：' + err.message);
        }
        e.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

    function formatExcelDate(val) {
      if (typeof val === 'number' && val > 40000 && val < 60000) {
        const date = new Date((val - 25569) * 86400 * 1000);
        return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
      }
      return String(val);
    }

    function renderSheetTabs(sheetNames) {
      const container = document.getElementById('sheet-tabs-container');
      container.innerHTML = sheetNames.map(name => `
        <button onclick="switchSheet('${name}')" id="sheet-btn-${name}" class="sheet-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-200/60 transition flex items-center gap-1">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> ${name}
        </button>
      `).join('');
      lucide.createIcons();
    }

    function switchSheet(sheetName) {
      currentSheetName = sheetName;
      currentRows = [...(allSheetData[sheetName] || [])];

      if (currentRows.length > 0) {
        dynamicHeaders = Object.keys(currentRows[0]);
      }

      document.querySelectorAll('.sheet-tab-btn').forEach(btn => {
        btn.className = 'sheet-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-200/60 transition flex items-center gap-1';
      });

      const activeBtn = document.getElementById(`sheet-btn-${sheetName}`);
      if (activeBtn) {
        activeBtn.className = 'sheet-tab-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow-sm flex items-center gap-1.5';
      }

      handleSearch();
    }

    function renderDynamicTable(rowsToRender) {
      const thead = document.getElementById('dynamic-thead');
      const tbody = document.getElementById('dynamic-tbody');

      let headerHTML = `<th class="py-3 px-4 w-12 text-center">#</th>`;
      dynamicHeaders.forEach(col => {
        headerHTML += `<th class="py-3 px-4">${col}</th>`;
      });
      thead.innerHTML = headerHTML;

      if (rowsToRender.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="${dynamicHeaders.length + 1}" class="text-center py-8 text-slate-400">
              <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 text-slate-300"></i>
              無符合條件的數據
            </td>
          </tr>
        `;
        lucide.createIcons();
        updateMetrics(0);
        return;
      }

      tbody.innerHTML = rowsToRender.map((row, index) => {
        let colsHTML = `<td class="py-3 px-4 text-center font-mono text-slate-400">${index + 1}</td>`;

        dynamicHeaders.forEach(colKey => {
          let val = row[colKey] !== undefined && row[colKey] !== null ? row[colKey] : '-';
          const keyLower = colKey.toLowerCase();

          if (keyLower.includes('location') || keyLower.includes('位置')) {
            const badgeStyle = locationBadges[val] || 'bg-slate-100 text-slate-700 border-slate-200';
            colsHTML += `<td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs font-bold border ${badgeStyle}">${val}</span></td>`;
          }
          else if (keyLower === 'qty' || keyLower.includes('數量')) {
            const num = Number(val) || 0;
            const qtyBadge = num > 0 
              ? `<span class="px-2.5 py-1 rounded-md text-xs font-bold bg-emerald-50 text-emerald-600 border border-emerald-200">${num}</span>`
              : `<span class="px-2.5 py-1 rounded-md text-xs font-bold bg-slate-100 text-slate-400 border border-slate-200">${num}</span>`;
            colsHTML += `<td class="py-3 px-4 text-center">${qtyBadge}</td>`;
          }
          else if (keyLower === 'in') {
            const num = Number(val) || 0;
            colsHTML += `<td class="py-3 px-4 text-center ${num > 0 ? 'text-emerald-600 font-bold' : 'text-slate-300'}">${num}</td>`;
          }
          else if (keyLower === 'out') {
            const num = Number(val) || 0;
            colsHTML += `<td class="py-3 px-4 text-center ${num > 0 ? 'text-amber-600 font-bold' : 'text-slate-300'}">${num}</td>`;
          }
          else {
            colsHTML += `<td class="py-3 px-4 text-slate-700 max-w-xs truncate">${val}</td>`;
          }
        });

        return `<tr class="hover:bg-slate-50/80 transition">${colsHTML}</tr>`;
      }).join('');

      lucide.createIcons();
      updateMetrics(rowsToRender.length);
    }

    function updateMetrics(renderedCount) {
      document.getElementById('stat-total-items').innerText = currentRows.length;
      document.getElementById('stat-total-cols').innerText = dynamicHeaders.length;
      document.getElementById('stat-sheet-name').innerText = currentSheetName || '-';

      const qtyCol = dynamicHeaders.find(h => h.toLowerCase().includes('qty') || h.toLowerCase().includes('數量'));
      let totalQty = 0;
      if (qtyCol) {
        totalQty = currentRows.reduce((sum, r) => sum + (Number(r[qtyCol]) || 0), 0);
      }
      document.getElementById('stat-total-qty').innerText = totalQty;
      document.getElementById('filtered-count').innerText = `顯示: ${renderedCount} 筆`;
    }

    function handleSearch() {
      const keyword = document.getElementById('search-input').value.toLowerCase();
      let filtered = currentRows.filter(row => {
        return dynamicHeaders.some(key => {
          return String(row[key] || '').toLowerCase().includes(keyword);
        });
      });
      renderDynamicTable(filtered);
    }

    // Modal 手動新增開關
    function openModal() { document.getElementById('item-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('item-modal').classList.add('hidden'); }

    // 手動表單提交送出
    function handleFormSubmit(e) {
      e.preventDefault();
      const newRow = {
        'LOCATION': document.getElementById('form-location').value,
        'MODEL': document.getElementById('form-model').value,
        'PARTS NAME': document.getElementById('form-parts-name').value,
        'QTY': Number(document.getElementById('form-qty').value) || 0,
        'IN': Number(document.getElementById('form-in').value) || 0,
        'OUT': Number(document.getElementById('form-out').value) || 0,
        'DATE': new Date().toLocaleDateString('zh-TW'),
        'REMARK': document.getElementById('form-remark').value
      };

      // 寫入當前表格
      currentRows.unshift(newRow);
      if (!allSheetData[currentSheetName]) allSheetData[currentSheetName] = [];
      allSheetData[currentSheetName].unshift(newRow);

      handleSearch();
      closeModal();

      // 自動同步到 Google Sheet API
      syncToGAS(newRow);
    }

    // Google Sheet API 同步設定
    function toggleSyncPanel() { document.getElementById('sync-panel').classList.toggle('hidden'); }

    function saveGasUrl() {
      const url = document.getElementById('gas-url-input').value.trim();
      localStorage.setItem('GAS_WEB_APP_URL', url);
      alert('Google Apps Script URL 已成功儲存！');
      checkSyncStatus();
    }

    function checkSyncStatus() {
      const savedUrl = localStorage.getItem('GAS_WEB_APP_URL');
      const dot = document.getElementById('sync-status-dot');
      if (savedUrl) {
        document.getElementById('gas-url-input').value = savedUrl;
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 ml-1 animate-pulse';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-slate-300 ml-1';
      }
    }

    async function syncToGAS(itemData) {
      const gasUrl = localStorage.getItem('GAS_WEB_APP_URL');
      if (!gasUrl) return;

      try {
        await fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...itemData, targetSheet: currentSheetName })
        });
        console.log('Synced to Google Sheet successfully.');
      } catch (err) {
        console.error('GAS Sync Error:', err);
      }
    }

    function exportCSV() {
      if (currentRows.length === 0) { alert('目前無數據可匯出！'); return; }
      let csv = '\uFEFF' + dynamicHeaders.join(',') + '\n';
      currentRows.forEach(row => {
        let line = dynamicHeaders.map(k => `"${String(row[k] || '').replace(/"/g, '""')}"`).join(',');
        csv += line + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${currentSheetName}_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.onload = () => {
      lucide.createIcons();
      checkSyncStatus();
      renderSheetTabs(Object.keys(allSheetData));
      switchSheet('Stock in TW');
    };
  </script>
</body>
</html>
