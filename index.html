<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PTW Taiwan Inventory System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS 用於 Excel 匯入匯出 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-gradient-to-br from-sky-50 via-slate-50 to-blue-50 text-slate-800 min-h-screen pb-12">

  <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelImport(event)">

  <!-- 頂部 Header -->
  <header class="bg-white/95 backdrop-blur border-b border-sky-100 sticky top-0 z-30 shadow-xs">
    <div class="w-full max-w-[97%] mx-auto px-2 sm:px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-sky-600 text-white flex items-center justify-center font-bold text-xl shadow-md shadow-sky-200">
          <i data-lucide="boxes" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-lg leading-tight">PTW Taiwan Inventory System</h1>
          <p class="text-xs text-sky-600 font-medium">8-Tabs Schema • Real-time DB IN/OUT Calculation</p>
        </div>
      </div>

      <!-- 功能操作按鈕 -->
      <div class="flex items-center gap-2">
        <button onclick="fetchDataFromGAS()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-sky-200 text-slate-700 bg-white hover:bg-sky-50 text-xs font-medium transition shadow-xs">
          <i data-lucide="refresh-cw" class="w-4 h-4 text-sky-600"></i>
          <span>刷新</span>
        </button>

        <button onclick="triggerFileInput()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-emerald-300 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 text-xs font-semibold transition shadow-xs">
          <i data-lucide="upload" class="w-4 h-4 text-emerald-600"></i>
          <span>匯入 Excel</span>
        </button>

        <button onclick="exportCSV()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-sky-200 text-slate-700 bg-white hover:bg-sky-50 text-xs font-medium transition shadow-xs">
          <i data-lucide="download" class="w-4 h-4 text-slate-500"></i>
          <span>匯出 CSV</span>
        </button>

        <button onclick="toggleSyncPanel()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-sky-200 text-slate-700 bg-white hover:bg-sky-50 text-xs font-medium transition shadow-xs">
          <i data-lucide="cloud" class="w-4 h-4 text-sky-500"></i>
          <span>API 設定</span>
          <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-emerald-500 ml-1"></span>
        </button>

        <button onclick="openModal()" class="flex items-center gap-1.5 bg-sky-600 hover:bg-sky-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium shadow-md shadow-sky-200 transition">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>新增紀錄</span>
        </button>
      </div>
    </div>
  </header>

  <!-- API 連線設定抽屜 -->
  <div id="sync-panel" class="hidden bg-slate-900 text-white border-b border-slate-800 p-4 transition-all">
    <div class="w-full max-w-[97%] mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <i data-lucide="key" class="w-5 h-5 text-sky-400"></i>
        <div>
          <p class="text-sm font-semibold">Google Apps Script Web App URL 設定</p>
          <p class="text-xs text-slate-400">請確認填入發布新版本產生的 /exec 網址</p>
        </div>
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <input type="text" id="gas-url-input" class="w-full md:w-96 px-3 py-1.5 rounded-lg text-xs bg-slate-800 border border-slate-700 text-slate-200 focus:outline-none focus:border-sky-500 font-mono">
        <button onclick="saveGasUrl()" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-500 text-xs font-medium rounded-lg whitespace-nowrap">儲存連線</button>
      </div>
    </div>
  </div>

  <main class="w-full max-w-[97%] mx-auto px-2 sm:px-4 pt-4 space-y-4">

    <!-- 載入通知 -->
    <div id="loading-bar" class="hidden bg-sky-100 border border-sky-300 rounded-xl p-3 flex items-center justify-between text-sky-800 text-xs font-semibold">
      <span class="flex items-center gap-2" id="loading-text">
        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 正在連線同步 Google Sheet...
      </span>
    </div>

    <!-- 統計卡片 -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="glass-card p-4 rounded-xl border border-sky-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">目前分頁品項</p>
          <h3 id="stat-total-items" class="text-2xl font-extrabold text-slate-800 mt-1">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-sky-50 flex items-center justify-center text-sky-600">
          <i data-lucide="layers" class="w-5 h-5"></i>
        </div>
      </div>

      <div class="glass-card p-4 rounded-xl border border-sky-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">在庫總數量 (QTY)</p>
          <h3 id="stat-total-qty" class="text-2xl font-extrabold text-emerald-600 mt-1">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-600">
          <i data-lucide="package-check" class="w-5 h-5"></i>
        </div>
      </div>

      <div class="glass-card p-4 rounded-xl border border-sky-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">零庫存/缺貨品項</p>
          <h3 id="stat-zero-qty" class="text-2xl font-extrabold text-rose-500 mt-1">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-50 flex items-center justify-center text-rose-500">
          <i data-lucide="package-x" class="w-5 h-5"></i>
        </div>
      </div>

      <div class="glass-card p-4 rounded-xl border border-sky-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">檢視中分頁</p>
          <h3 id="stat-sheet-name" class="text-lg font-bold text-sky-700 mt-1 truncate">stock in TW</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-sky-100 flex items-center justify-center text-sky-700">
          <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
        </div>
      </div>
    </div>

    <!-- 8 大分頁切換列 (嚴格規定順序) -->
    <div class="space-y-3 pt-1">
      <div class="flex items-center justify-between gap-2 border-b border-sky-200/80 pb-2 overflow-x-auto no-scrollbar">
        <div class="flex items-center gap-2 flex-nowrap" id="sheet-tabs-container">
          <!-- 動態載入 8 個分頁按鈕 -->
        </div>
        <span id="filtered-count" class="text-xs font-semibold text-sky-800 bg-sky-100/80 border border-sky-200 px-3 py-1 rounded-lg whitespace-nowrap">
          0 筆
        </span>
      </div>

      <!-- 搜尋列與欄位調整 -->
      <div class="bg-white/95 backdrop-blur p-3 rounded-xl border border-sky-100 shadow-xs flex items-center gap-3">
        <div class="relative w-full">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="搜尋目前分頁資料 (料號, 品名, 機型, 備註...)" class="w-full pl-10 pr-4 py-2 text-sm rounded-lg bg-sky-50/50 border border-sky-200 focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
      </div>
    </div>

    <!-- 滿版資料表格 -->
    <div class="bg-white rounded-xl border border-sky-100 shadow-sm overflow-hidden flex flex-col">
      <div class="overflow-x-auto max-h-[66vh] overflow-y-auto relative">
        <table class="w-full text-left border-collapse min-w-[900px]">
          <thead class="sticky top-0 z-20 bg-sky-100/95 backdrop-blur shadow-xs">
            <tr id="dynamic-thead" class="text-xs font-bold text-slate-700 uppercase tracking-wider">
              <!-- 動態表頭依分頁不同自動調整 -->
            </tr>
          </thead>
          <tbody id="dynamic-tbody" class="divide-y divide-slate-100 text-sm">
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal：新增 / 編輯視窗 -->
  <div id="item-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-sky-200 shadow-2xl w-full max-w-lg overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4 text-sky-600"></i>
          <span id="modal-title">新增零件紀錄</span>
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form id="item-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="form-edit-index" value="-1">
        <input type="hidden" id="form-edit-rowindex" value="">

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">目標庫位分頁 (Target Tab)</label>
            <select id="form-target-sheet" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="S2">S2</option>
              <option value="S3">S3</option>
              <option value="S4" selected>S4</option>
              <option value="S5">S5</option>
              <option value="S6">S6</option>
              <option value="DRY BOX">DRY BOX</option>
              <option value="clean room">clean room</option>
              <option value="stock in TW">stock in TW (總庫存主表)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">料號 (P/N (If any))</label>
            <input type="text" id="form-pn" placeholder="例如: VQ1301-5B1" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 (Parts Name)</label>
          <input type="text" id="form-parts-name" required placeholder="例如: Solenoid" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50">
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-emerald-600 mb-1">進貨量 (IN)</label>
            <input type="number" id="form-in" value="0" min="0" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 text-center font-bold">
          </div>
          <div>
            <label class="block text-xs font-semibold text-amber-600 mb-1">出貨量 (OUT)</label>
            <input type="number" id="form-out" value="0" min="0" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 text-center font-bold">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">機型 (Model)</label>
            <input type="text" id="form-model" placeholder="例如: 93xx" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">備註 (Remark)</label>
          <input type="text" id="form-remarks" placeholder="例如: To TSMC 3" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50">
        </div>

        <div class="pt-2 flex items-center justify-end gap-3 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl">取消</button>
          <button type="submit" class="px-5 py-2 text-xs font-medium bg-sky-600 hover:bg-sky-700 text-white rounded-xl shadow-md shadow-sky-200">儲存並同步至 Google Sheet</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 預設後端 API 網址 (請填入您發布後的 /exec 網址)
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbx_aFxaqB69URgcvpm-IPS8wsU14i5l2PFaPBq5HBXptg81hCmME73N4lRCBDagYU5QVw/exec";

    // 規定嚴格排序之 8 大分頁 (排除 S1 與 Print 頁)
    const orderedSheetNames = ['stock in TW', 'S2', 'S3', 'S4', 'S5', 'S6', 'DRY BOX', 'clean room'];

    let allSheetData = {};
    let currentSheetName = 'stock in TW';
    let currentRows = [];
    let filteredRows = [];

    function getGasUrl() {
      return localStorage.getItem('GAS_WEB_APP_URL') || DEFAULT_GAS_URL;
    }

    // 模糊搜尋欄位值
    function getVal(row, keys) {
      if (!row) return '';
      const rowKeys = Object.keys(row);
      for (const target of keys) {
        if (row[target] !== undefined && row[target] !== null && String(row[target]).trim() !== '') {
          return String(row[target]).trim();
        }
        const found = rowKeys.find(k => k.trim().toLowerCase() === target.trim().toLowerCase());
        if (found && row[found] !== undefined && row[found] !== null && String(row[found]).trim() !== '') {
          return String(row[found]).trim();
        }
      }
      return '';
    }

    // 格式化各子分頁明細紀錄
    function normalizeDetailRow(r, sheetName) {
      const pn = getVal(r, ['P/N (If any)', 'P/N', '料號']);
      const name = getVal(r, ['Parts Name', '品名', '零件名稱']);
      const model = getVal(r, ['Model', '機型']);
      const inVal = parseFloat(getVal(r, ['IN', '進貨'])) || 0;
      const outVal = parseFloat(getVal(r, ['OUT', '出貨'])) || 0;
      const dateVal = getVal(r, ['Date', '日期']);
      const remarkVal = getVal(r, ['Remark', 'Remarks', '備註']);
      const rowIndex = r._rowIndex || null;

      return {
        'Date': dateVal,
        'P/N (If any)': pn.trim(),
        'Parts Name': name.trim(),
        'Model': model.trim(),
        'IN': inVal,
        'OUT': outVal,
        'Remark': remarkVal,
        'LOCATION': sheetName,
        '_rowIndex': rowIndex,
        '_sourceSheet': sheetName
      };
    }

    // 🌟 核心庫存計算：遍歷 S2, S3, S4, S5, S6, DRY BOX, clean room
    // 依據 P/N + Parts Name 吻合聚合，直接統計 (Total IN - Total OUT) 呈現在 stock in TW
    function calculateStockInTW() {
      const dbSheets = ['S2', 'S3', 'S4', 'S5', 'S6', 'DRY BOX', 'clean room'];
      const summaryMap = new Map();

      // 先抓取目前 stock in TW 已有的基本資料 (Unit, Category, Status, Remarks)
      const existingMaster = allSheetData['stock in TW'] || [];
      existingMaster.forEach(r => {
        const pn = getVal(r, ['P/N (If any)', 'P/N']).trim();
        const name = getVal(r, ['Parts Name', '品名']).trim();
        if (!name && !pn) return;
        const key = `${pn.toLowerCase()}___${name.toLowerCase()}`;
        summaryMap.set(key, {
          pn: pn,
          name: name,
          unit: getVal(r, ['Unit']) || 'PCS',
          category: getVal(r, ['Category']),
          status: getVal(r, ['Status']) || 'Good',
          model: getVal(r, ['Model']),
          remarks: getVal(r, ['Remarks', 'Remark']),
          locations: new Set(),
          totalIn: 0,
          totalOut: 0,
          _rowIndex: r._rowIndex || null
        });
      });

      // 累加 7 大資料庫庫位的 IN 與 OUT
      dbSheets.forEach(sName => {
        const rows = allSheetData[sName] || [];
        rows.forEach(r => {
          const item = normalizeDetailRow(r, sName);
          const pn = item['P/N (If any)'];
          const name = item['Parts Name'];
          if (!name && !pn) return;

          const key = `${pn.toLowerCase()}___${name.toLowerCase()}`;
          if (!summaryMap.has(key)) {
            summaryMap.set(key, {
              pn: pn,
              name: name,
              unit: 'PCS',
              category: '',
              status: 'Good',
              model: item['Model'],
              remarks: item['Remark'],
              locations: new Set([sName]),
              totalIn: 0,
              totalOut: 0,
              _rowIndex: null
            });
          }

          const target = summaryMap.get(key);
          target.locations.add(sName);
          target.totalIn += item['IN'];
          target.totalOut += item['OUT'];
          if (!target.model && item['Model']) target.model = item['Model'];
        });
      });

      // 產生 stock in TW 的 9 欄標準資料
      let masterRows = [];
      summaryMap.forEach(item => {
        const netQty = item.totalIn - item.totalOut;
        masterRows.push({
          'P/N (If any)': item.pn || '-',
          'Parts Name': item.name || '-',
          'QTY': isNaN(netQty) ? 0 : netQty,
          'Unit': item.unit || 'PCS',
          'Category': item.category || '-',
          'Status': item.status || 'Good',
          'Model': item.model || '-',
          'Remarks': item.remarks || '',
          'LOCATION': Array.from(item.locations).join(', ') || 'TW',
          '_rowIndex': item._rowIndex,
          '_sourceSheet': 'stock in TW'
        });
      });

      allSheetData['stock in TW'] = masterRows;
    }

    // 從 Google Sheet 抓取所有分頁
    async function fetchDataFromGAS() {
      const gasUrl = getGasUrl();
      if (!gasUrl) return;

      const loadingBar = document.getElementById('loading-bar');
      loadingBar.classList.remove('hidden');

      try {
        const res = await fetch(gasUrl);
        const json = await res.json();

        if (json.status === 'success' && json.data) {
          allSheetData = json.data;

          // 重新計算 stock in TW 庫存彙總
          calculateStockInTW();

          renderSheetTabs();
          switchSheet(currentSheetName);
        }
      } catch (err) {
        console.error('抓取資料失敗:', err);
      } finally {
        loadingBar.classList.add('hidden');
      }
    }

    // 渲染分頁切換按鈕
    function renderSheetTabs() {
      const container = document.getElementById('sheet-tabs-container');
      container.innerHTML = orderedSheetNames.map(name => `
        <button onclick="switchSheet('${name}')" id="sheet-btn-${name.replace(/\s+/g, '_')}" class="sheet-tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-white/80 border border-sky-100 hover:bg-sky-100 text-slate-700 transition flex items-center gap-1.5 whitespace-nowrap shadow-2xs">
          <i data-lucide="file-spreadsheet" class="w-4 h-4 text-sky-600"></i> ${name}
        </button>
      `).join('');
      lucide.createIcons();
    }

    // 切換分頁
    function switchSheet(sheetName) {
      currentSheetName = sheetName;
      if (sheetName === 'stock in TW') {
        calculateStockInTW();
        currentRows = [...(allSheetData['stock in TW'] || [])];
      } else {
        const raw = allSheetData[sheetName] || [];
        currentRows = raw.map(r => normalizeDetailRow(r, sheetName));
      }

      // 更新按鈕樣式
      document.querySelectorAll('.sheet-tab-btn').forEach(btn => {
        btn.className = 'sheet-tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-white/80 border border-sky-100 hover:bg-sky-100 text-slate-700 transition flex items-center gap-1.5 whitespace-nowrap shadow-2xs';
      });

      const activeBtn = document.getElementById(`sheet-btn-${sheetName.replace(/\s+/g, '_')}`);
      if (activeBtn) {
        activeBtn.className = 'sheet-tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-sky-600 text-white shadow-sm flex items-center gap-1.5 whitespace-nowrap';
      }

      handleSearch();
    }

    function handleSearch() {
      const keyword = document.getElementById('search-input').value.toLowerCase();
      filteredRows = currentRows.filter(row => {
        if (!keyword) return true;
        return Object.values(row).some(v => String(v || '').toLowerCase().includes(keyword));
      });
      renderTable();
    }

    // 渲染表格內容 (依據是否為 stock in TW 分流顯示欄位)
    function renderTable() {
      const thead = document.getElementById('dynamic-thead');
      const tbody = document.getElementById('dynamic-tbody');

      const isMaster = currentSheetName === 'stock in TW';

      // 建立表頭
      if (isMaster) {
        // stock in TW 9 欄
        thead.innerHTML = `
          <th class="py-3 px-4 w-12 text-center">#</th>
          <th class="py-3 px-4">P/N (If any)</th>
          <th class="py-3 px-4">Parts Name</th>
          <th class="py-3 px-4 text-center">QTY (總庫存)</th>
          <th class="py-3 px-4">Unit</th>
          <th class="py-3 px-4">Category</th>
          <th class="py-3 px-4">Status</th>
          <th class="py-3 px-4">Model</th>
          <th class="py-3 px-4">Remarks</th>
          <th class="py-3 px-4">LOCATION</th>
          <th class="py-3 px-4 text-center w-24">操作</th>
        `;
      } else {
        // S2 ~ S6, DRY BOX, clean room 7 欄
        thead.innerHTML = `
          <th class="py-3 px-4 w-12 text-center">#</th>
          <th class="py-3 px-4">Date</th>
          <th class="py-3 px-4">P/N (If any)</th>
          <th class="py-3 px-4">Parts Name</th>
          <th class="py-3 px-4">Model</th>
          <th class="py-3 px-4 text-center">IN</th>
          <th class="py-3 px-4 text-center">OUT</th>
          <th class="py-3 px-4">Remark</th>
          <th class="py-3 px-4 text-center w-24">操作</th>
        `;
      }

      if (filteredRows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="12" class="text-center py-12 text-slate-400">目前無任何資料</td></tr>`;
        updateMetrics();
        return;
      }

      tbody.innerHTML = filteredRows.map((row, index) => {
        if (isMaster) {
          const qty = Number(row['QTY']) || 0;
          const qtyBadge = qty > 0 
            ? `<span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-300">${qty}</span>`
            : `<span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-rose-50 text-rose-600 border border-rose-300">${qty}</span>`;

          return `
            <tr class="hover:bg-sky-50/50 transition">
              <td class="py-3 px-4 text-center font-mono text-slate-400 text-xs">${index + 1}</td>
              <td class="py-3 px-4 font-mono font-semibold text-slate-800">${row['P/N (If any)'] || '-'}</td>
              <td class="py-3 px-4 font-bold text-slate-900">${row['Parts Name'] || '-'}</td>
              <td class="py-3 px-4 text-center">${qtyBadge}</td>
              <td class="py-3 px-4 text-slate-600">${row['Unit'] || 'PCS'}</td>
              <td class="py-3 px-4 text-slate-600">${row['Category'] || '-'}</td>
              <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-700">${row['Status'] || 'Good'}</span></td>
              <td class="py-3 px-4 text-slate-600">${row['Model'] || '-'}</td>
              <td class="py-3 px-4 text-slate-600">${row['Remarks'] || ''}</td>
              <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs font-bold border border-sky-200 bg-sky-50 text-sky-700">${row['LOCATION'] || 'TW'}</span></td>
              <td class="py-3 px-4 text-center">
                <div class="flex items-center justify-center gap-1.5">
                  <button onclick="editRow(${index})" class="p-1.5 text-slate-400 hover:text-sky-600 rounded transition" title="編輯"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                  <button onclick="deleteRow(${index})" class="p-1.5 text-slate-400 hover:text-rose-600 rounded transition" title="刪除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
              </td>
            </tr>
          `;
        } else {
          return `
            <tr class="hover:bg-sky-50/50 transition">
              <td class="py-3 px-4 text-center font-mono text-slate-400 text-xs">${index + 1}</td>
              <td class="py-3 px-4 font-mono text-slate-600">${row['Date'] || ''}</td>
              <td class="py-3 px-4 font-mono font-semibold text-slate-800">${row['P/N (If any)'] || '-'}</td>
              <td class="py-3 px-4 font-bold text-slate-900">${row['Parts Name'] || '-'}</td>
              <td class="py-3 px-4 text-slate-600">${row['Model'] || '-'}</td>
              <td class="py-3 px-4 text-center font-semibold text-emerald-600">${row['IN'] || ''}</td>
              <td class="py-3 px-4 text-center font-semibold text-amber-600">${row['OUT'] || ''}</td>
              <td class="py-3 px-4 text-slate-600">${row['Remark'] || ''}</td>
              <td class="py-3 px-4 text-center">
                <div class="flex items-center justify-center gap-1.5">
                  <button onclick="editRow(${index})" class="p-1.5 text-slate-400 hover:text-sky-600 rounded transition" title="編輯"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                  <button onclick="deleteRow(${index})" class="p-1.5 text-slate-400 hover:text-rose-600 rounded transition" title="刪除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
              </td>
            </tr>
          `;
        }
      }).join('');

      lucide.createIcons();
      updateMetrics();
    }

    function updateMetrics() {
      document.getElementById('stat-total-items').innerText = currentRows.length;
      document.getElementById('stat-sheet-name').innerText = currentSheetName;

      let totalQty = 0;
      let zeroCount = 0;

      if (currentSheetName === 'stock in TW') {
        currentRows.forEach(r => {
          const q = Number(r['QTY']) || 0;
          totalQty += q;
          if (q <= 0) zeroCount++;
        });
      } else {
        currentRows.forEach(r => {
          const inVal = Number(r['IN']) || 0;
          const outVal = Number(r['OUT']) || 0;
          totalQty += (inVal - outVal);
        });
      }

      document.getElementById('stat-total-qty').innerText = totalQty;
      document.getElementById('stat-zero-qty').innerText = zeroCount;
      document.getElementById('filtered-count').innerText = `${filteredRows.length} 筆`;
    }

    function openModal() {
      document.getElementById('form-edit-index').value = "-1";
      document.getElementById('form-edit-rowindex').value = "";
      document.getElementById('modal-title').innerText = "新增零件紀錄";
      document.getElementById('form-target-sheet').value = currentSheetName === 'stock in TW' ? 'S4' : currentSheetName;
      document.getElementById('form-pn').value = "";
      document.getElementById('form-parts-name').value = "";
      document.getElementById('form-in').value = "0";
      document.getElementById('form-out').value = "0";
      document.getElementById('form-model').value = "";
      document.getElementById('form-remarks').value = "";
      document.getElementById('item-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('item-modal').classList.add('hidden');
    }

    // 編輯資料列
    function editRow(index) {
      const row = filteredRows[index];
      if (!row) return;

      document.getElementById('form-edit-index').value = index;
      document.getElementById('form-edit-rowindex').value = row._rowIndex || '';
      document.getElementById('modal-title').innerText = "編輯零件紀錄";

      document.getElementById('form-target-sheet').value = row._sourceSheet || currentSheetName;
      document.getElementById('form-pn').value = row['P/N (If any)'] !== '-' ? row['P/N (If any)'] : '';
      document.getElementById('form-parts-name').value = row['Parts Name'] !== '-' ? row['Parts Name'] : '';
      document.getElementById('form-in').value = row['IN'] || 0;
      document.getElementById('form-out').value = row['OUT'] || 0;
      document.getElementById('form-model').value = row['Model'] !== '-' ? row['Model'] : '';
      document.getElementById('form-remarks').value = row['Remark'] || row['Remarks'] || '';

      document.getElementById('item-modal').classList.remove('hidden');
    }

    // 刪除資料列 (真連動 Google Sheet)
    async function deleteRow(index) {
      const row = filteredRows[index];
      if (!row) return;

      const pName = row['Parts Name'];
      const pn = row['P/N (If any)'];
      const targetSheet = row._sourceSheet || currentSheetName;
      const rowIndex = row._rowIndex;

      if (!confirm(`確定要將「${pName}」自 Google Sheet 的 ${targetSheet} 分頁徹底刪除嗎？`)) {
        return;
      }

      // 前端先移除
      currentRows = currentRows.filter(r => r !== row);
      if (allSheetData[targetSheet]) {
        allSheetData[targetSheet] = allSheetData[targetSheet].filter(r => r !== row);
      }
      calculateStockInTW();
      handleSearch();

      // 送出刪除命令
      const gasUrl = getGasUrl();
      if (!gasUrl) return;

      const loadingBar = document.getElementById('loading-bar');
      loadingBar.classList.remove('hidden');

      try {
        await fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'DELETE',
            targetSheet: targetSheet,
            rowIndex: rowIndex,
            pn: pn,
            partsName: pName
          })
        });
        setTimeout(fetchDataFromGAS, 1500);
      } catch (err) {
        console.error('刪除失敗:', err);
      } finally {
        loadingBar.classList.add('hidden');
      }
    }

    // 表單送出 (新增 / 更新)
    function handleFormSubmit(e) {
      e.preventDefault();
      const editIdx = parseInt(document.getElementById('form-edit-index').value);
      const editRowIndex = document.getElementById('form-edit-rowindex').value;
      const targetSheet = document.getElementById('form-target-sheet').value;

      const pn = document.getElementById('form-pn').value.trim();
      const partsName = document.getElementById('form-parts-name').value.trim();
      const inVal = Number(document.getElementById('form-in').value) || 0;
      const outVal = Number(document.getElementById('form-out').value) || 0;
      const model = document.getElementById('form-model').value.trim();
      const remark = document.getElementById('form-remarks').value.trim();

      const d = new Date();
      const dateVal = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;

      closeModal();

      const isUpdate = editIdx >= 0 && editRowIndex !== '';
      const payload = {
        action: isUpdate ? 'UPDATE' : 'ADD',
        targetSheet: targetSheet,
        rowIndex: isUpdate ? parseInt(editRowIndex) : null,
        date: dateVal,
        pn: pn,
        partsName: partsName,
        model: model,
        in: inVal,
        out: outVal,
        remark: remark
      };

      const gasUrl = getGasUrl();
      if (gasUrl) {
        const loadingBar = document.getElementById('loading-bar');
        loadingBar.classList.remove('hidden');
        fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(() => {
          setTimeout(fetchDataFromGAS, 1500);
        }).finally(() => {
          loadingBar.classList.add('hidden');
        });
      }
    }

    // 匯入 Excel 檔案功能
    function triggerFileInput() {
      document.getElementById('excel-file-input').click();
    }

    function handleExcelImport(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          let importedAll = {};

          workbook.SheetNames.forEach(name => {
            if (orderedSheetNames.includes(name)) {
              const ws = workbook.Sheets[name];
              const json = XLSX.utils.sheet_to_json(ws);
              if (json && json.length > 0) {
                importedAll[name] = json;
              }
            }
          });

          const gasUrl = getGasUrl();
          if (gasUrl) {
            const loadingBar = document.getElementById('loading-bar');
            loadingBar.classList.remove('hidden');
            await fetch(gasUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'BULK_IMPORT', allData: importedAll })
            });
            setTimeout(fetchDataFromGAS, 2000);
          }
          alert('Excel 匯入完成，已同步上傳 Google Sheet！');
        } catch (err) {
          alert('匯入失敗：' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      e.target.value = '';
    }

    // 匯出 CSV 功能
    function exportCSV() {
      if (filteredRows.length === 0) {
        alert('無資料可匯出');
        return;
      }
      const headers = Object.keys(filteredRows[0]).filter(k => !k.startsWith('_'));
      let csv = '\uFEFF' + headers.join(',') + '\n';
      filteredRows.forEach(r => {
        csv += headers.map(h => `"${String(r[h] || '').replace(/"/g, '""')}"`).join(',') + '\n';
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentSheetName}_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function toggleSyncPanel() {
      document.getElementById('sync-panel').classList.toggle('hidden');
    }

    function saveGasUrl() {
      const url = document.getElementById('gas-url-input').value.trim();
      localStorage.setItem('GAS_WEB_APP_URL', url);
      alert('已儲存 API 網址！');
      fetchDataFromGAS();
    }

    window.onload = () => {
      lucide.createIcons();
      document.getElementById('gas-url-input').value = getGasUrl();
      fetchDataFromGAS();
    };
  </script>
</body>
</html>
